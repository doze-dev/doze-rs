# doze in Rust: one workspace, each part its own crate. doze-kafka is ported
# first; the plan is docs/port/PLAN.md.
[workspace]
resolver = "3"
members = ["crates/*", "xtask", "codegen"]
# Vendored third-party code (see vendor/*/PATCHES.md) is not ours to lint or size-check.
exclude = ["vendor"]

[patch.crates-io]
kafka-protocol = { path = "vendor/kafka-protocol" }

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/doze-dev/doze-rs"
rust-version = "1.99"
publish = false

# One set of rules for every crate (`[lints] workspace = true`). The port's
# quality rules live here and in clippy.toml, not in anyone's head.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# No panics in production code (clippy.toml allows them in tests).
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Ownership over locks: never hold a lock across an await.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Small functions, few arguments.
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Cold code (the web console's pages and HTTP stack, the command line, log formatting) is built for size; the broker's
# hot path (kafka-broker, -wire, -storage, -meta, -server, redb, tokio, the codecs) stays at opt-level 3.
[profile.release.package.kafka-console]
opt-level = "z"
[profile.release.package.axum]
opt-level = "z"
[profile.release.package.axum-core]
opt-level = "z"
[profile.release.package.hyper]
opt-level = "z"
[profile.release.package.hyper-util]
opt-level = "z"
[profile.release.package.http]
opt-level = "z"
[profile.release.package.httparse]
opt-level = "z"
[profile.release.package.tower]
opt-level = "z"
[profile.release.package.matchit]
opt-level = "z"
[profile.release.package.clap]
opt-level = "z"
[profile.release.package.clap_builder]
opt-level = "z"
[profile.release.package.clap_lex]
opt-level = "z"
[profile.release.package.tracing-subscriber]
opt-level = "z"
[profile.release.package.regex-automata]
opt-level = "z"
[profile.release.package.regex-syntax]
opt-level = "z"
