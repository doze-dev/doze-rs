# doze in Rust: one workspace, each part its own crate. doze-kafka is ported
# first; the plan is docs/port/PLAN.md.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask", "codegen"]
# The desktop app (apps/doze-app) is a member but not a default one: GPUI pulls in a few hundred crates and needs
# macOS's Metal toolchain, so a bare `cargo build` / `cargo test` leaves it out, and the `--workspace` jobs exclude it.
# Its own CI job (`app` in ci.yml) builds, lints and tests it on macOS. docs/port/app/PLAN.md §4.2, step 0.1.
default-members = ["crates/*", "xtask", "codegen"]
# Vendored third-party code (see vendor/*/PATCHES.md) is not ours to lint or size-check.
exclude = ["vendor"]

[patch.crates-io]
kafka-protocol = { path = "vendor/kafka-protocol" }
# GPUI's macOS renderer without MSAA for paths (vendor/gpui-pre-apple/PATCHES.md). Only the app links it.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# GPUI with the image crate built for PNG only (vendor/gpui-pre/PATCHES.md): the app ships PNG and SVG, never decodes
# the other formats upstream turns on. Only the app links these.
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
hcl-edit = { path = "vendor/hcl-edit" }

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/doze-dev/doze-rs"
rust-version = "1.99"
publish = false

# One set of rules for every crate (`[lints] workspace = true`). The port's
# quality rules live here and in clippy.toml, not in anyone's head.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# No panics in production code (clippy.toml allows them in tests).
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Ownership over locks: never hold a lock across an await.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Small functions, few arguments.
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Cold code (the web console's pages and HTTP stack, the command line, log formatting) is built for size; the broker's
# hot path (kafka-broker, -wire, -storage, -meta, -server, redb, tokio, the codecs) stays at opt-level 3.
[profile.release.package.kafka-console]
opt-level = "z"
# The schema registry is HTTP and schema text, answered a few times a second at most: built for size too (docs/port/phase10.md).
[profile.release.package.kafka-registry]
opt-level = "z"
[profile.release.package.axum]
opt-level = "z"
[profile.release.package.axum-core]
opt-level = "z"
[profile.release.package.hyper]
opt-level = "z"
[profile.release.package.hyper-util]
opt-level = "z"
[profile.release.package.http]
opt-level = "z"
[profile.release.package.httparse]
opt-level = "z"
[profile.release.package.tower]
opt-level = "z"
[profile.release.package.matchit]
opt-level = "z"
[profile.release.package.clap]
opt-level = "z"
# doze.hcl is read once per command or daemon start: the HCL crates are built for size (core C2 measured doze at
# 6,421,104 B with them at opt-level 3 and 6,157,408 B at "s", darwin/arm64; docs/port/core/weight.md).
[profile.release.package.doze-hcl]
opt-level = "s"
[profile.release.package.doze-config]
opt-level = "s"
[profile.release.package.hcl-edit]
opt-level = "s"
[profile.release.package.clap_builder]
opt-level = "z"
[profile.release.package.clap_lex]
opt-level = "z"
[profile.release.package.tracing-subscriber]
opt-level = "z"
[profile.release.package.regex-automata]
opt-level = "z"
[profile.release.package.regex-syntax]
opt-level = "z"
# doze-aws is built smaller than the broker: optimised for size ("z") with fat LTO. "s" was 33% smaller than the release profile on the same
# code (6.97 MB to 4.66 MB, 2026-11-13) and "z" a further 25% (6.50 MB to 4.87 MB at the Lambda stage), for 30 to 60% more server CPU per
# request (0.2 to 0.7 ms) and about 0.4 MB more idle memory; wall time is unchanged. The owner chose "z" on 2026-11-13.
# `cargo xtask weight` builds it with this profile.
# The desktop app (apps/doze-app) is held to its line (docs/port/weight.md; ceiling 20 MB). M1 took the release build to 16.38 MB; optimised
# for size with fat LTO it is back under the line (see weight.md, "After M1 combined", for the binary, first frame and
# idle memory each way). CI's weight line builds it with this profile.
[profile.release-app]
inherits = "release"
opt-level = "s"
lto = "fat"
# Small core, fast GUI (weight.md, "The app's size profile"): what the app carries but does not draw with is built for
# size ("z"); GPUI, gpui-component, the app, doze-desk and doze-map, and the text, layout and path crates stay at "s",
# as before. 15,240,704 B against 16,102,720 B with everything at "s" (14,526,560 B with the PNG-only image patch,
# vendor/gpui-pre/PATCHES.md); frame, layout and first-frame times unchanged, `doze-app status` within noise. GPUI at
# opt-level 3 was measured too: 2.8 MB more for no measurable gain on the Map; doze-desk and doze-map at 3 gained nothing.
# The doze core the app carries (the CLI and what it runs; not the app's own doze-desk and doze-map, which draw).
[profile.release-app.package.doze-cli]
opt-level = "z"
