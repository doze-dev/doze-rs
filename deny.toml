# Supply-chain rules. `cargo deny check` runs in CI. Every exception needs a reason.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the build. An accepted advisory goes in
# `ignore` with the reason and the date to revisit it.
ignore = [
    # RUSTSEC-2023-0071 (the Marvin attack: key recovery through timing side channels in RSA decryption). It comes from the `rsa` crate
    # in aws-kms, which makes the RSA key specs of KMS (RSA_2048 to RSA_4096: sign, verify, OAEP). The attack needs an attacker who can
    # time many private-key operations; here the only caller of those operations is the developer's own process against an emulator on
    # their own machine, with keys that protect nothing (docs/port/aws/PLAN.md, A6). No fixed release exists. Revisit 2027-02-13, or
    # when a fixed `rsa` is released, whichever is first.
    "RUSTSEC-2023-0071",
]

[licenses]
# Permissive licences only; the repo is Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # minicbor (the module protocol's encoding, chosen in spike S0): the Blue Oak Model License is permissive and
    # OSI-approved. Owner decision 2026-11-12.
    "BlueOak-1.0.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions cost binary size; they are reviewed, not forbidden.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
