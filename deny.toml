# Supply-chain rules. `cargo deny check` runs in CI. Every exception needs a reason.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the build. An accepted advisory goes in
# `ignore` with the reason and the date to revisit it.
ignore = []

[licenses]
# Permissive licences only; the repo is Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions cost binary size; they are reviewed, not forbidden.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
