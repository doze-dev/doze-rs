# What the compatibility page says that the code cannot: deliberate differences from AWS, and why an operation is not planned.
# `tools/compat/generate.ts` combines this with the operations the binary serves (`doze-aws compat`) and the last conformance scores
# (`conformance/results.tsv`) into `docs/aws/COMPATIBILITY.md`. An operation not built and not listed under `not_planned` is shown
# as planned. Operation names must match AWS's model exactly; the generator refuses one that does not.

[global]
differences = [
  "Requests are not signature-checked by default (`--auth trust`): any access key works, as with most local AWS tools. `--auth verify` checks every SigV4 signature against the configured key and the keys IAM issues.",
  "IAM refusals are logged and let through by default (`--iam soft`), so a missing permission is a warning in development rather than a failure. `--iam enforce` refuses as AWS does; `--iam off` skips evaluation.",
  "One account (`--account`, default 000000000000) and every region, each region kept apart on disk.",
  "Nothing leaves the machine unless a target says so: SMS, email and mobile push are accepted and sent nowhere; HTTP(S) subscriptions, API destinations and webhooks are really called.",
  "CloudFormation makes the resources of the services doze-aws runs. A resource of a service it does not run (Cognito, ECS, AppSync, load balancers...) is not created: the stack carries on, the resource reports CREATE_COMPLETE with a status reason saying so, and a warning is logged.",
]

[api."CloudWatch Logs"]
differences = [
  "Events older than 7 days are removed (`--logs-retention-days`, 0 to keep them as AWS does), and a log group keeps at most 100,000 events (`--logs-max-events`). Local logs grow fast; this keeps the disk in check.",
  "Logs Insights runs the Logs Insights query language (CWLI) only: OpenSearch SQL and PPL, the `SOURCE` command and the `pattern`, `diff`, `anomaly`, `filterIndex`, `unnest` and `lookup` commands are refused with a sentence. `pct` is exact (AWS estimates). Queries and their results are kept in memory, the newest 200 queries and at most 1,000,000 result rows: a restart forgets them (AWS keeps results for days).",
  "A sort that is not followed only by `limit`, `fields` or `display`, and a stats command, hold at most 1,000,000 rows or groups; past that the query fails and says so.",
  "Field indexes change no answer and no cost locally (every event in range is read): policies are checked and kept, `DescribeFieldIndexes` reports when each indexed field was first and last seen, and `estimatedRecordsSkipped` stays 0.",
  "An export task runs before `CreateExportTask` answers (AWS runs it in the background), so it is `COMPLETED` or `FAILED` when first described; a bucket S3 cannot write to refuses the call.",
  "Destinations are one account's: the access policy is checked as JSON, kept and not evaluated. A subscription filter to a destination of the same region delivers to its Kinesis stream; a Firehose target is kept and not delivered.",
  "Transformers: `parseCloudfront`, `parseRoute53`, `parsePostgres` and `parseToOCSF` are refused (their logs are vended by AWS services that do not run locally); `dateTimeConverter` reads English month and day names only.",
  "Scheduled queries run on their schedule and write their answer to the local S3 as JSON rows; a lookup-table destination is refused.",
]
not_planned = [
  { why = "Large log objects exist only for logs ingested through OpenTelemetry (PutOpenTelemetryLogs), which this model and doze-aws do not have; there is never an object to fetch.", ops = ["GetLogObject"] },
  { why = "Data sources are named by AWS-vended logs and CloudWatch pipelines, which do not exist locally; GetLogGroupFields answers the same question for a log group.", ops = ["GetLogFields"] },
  { why = "Vended logs: delivery of logs AWS services emit about themselves, which do not exist locally.", ops = ["PutDeliverySource", "GetDeliverySource", "DescribeDeliverySources", "DeleteDeliverySource", "PutDeliveryDestination", "GetDeliveryDestination", "DescribeDeliveryDestinations", "DeleteDeliveryDestination", "PutDeliveryDestinationPolicy", "GetDeliveryDestinationPolicy", "DeleteDeliveryDestinationPolicy", "CreateDelivery", "GetDelivery", "DescribeDeliveries", "DeleteDelivery", "UpdateDeliveryConfiguration", "DescribeConfigurationTemplates"] },
  { why = "Machine-learning anomaly detection over log patterns: no meaningful local equivalent.", ops = ["CreateLogAnomalyDetector", "GetLogAnomalyDetector", "ListLogAnomalyDetectors", "UpdateLogAnomalyDetector", "DeleteLogAnomalyDetector", "ListAnomalies", "UpdateAnomaly"] },
  { why = "Integrations with OpenSearch Service and S3 Tables, which doze-aws does not run.", ops = ["PutIntegration", "GetIntegration", "ListIntegrations", "DeleteIntegration", "AssociateSourceToS3TableIntegration", "DisassociateSourceFromS3TableIntegration", "ListSourcesForS3TableIntegration"] },
  { why = "Newer features with no local use yet: lookup tables, syslog intake, storage tiers, bearer-token ingestion, import tasks, aggregate summaries.", families = ["LookupTable", "Syslog", "StorageTierPolicy", "BearerToken", "ImportTask", "AggregateLogGroupSummaries"] },
]

[api."DynamoDB"]
differences = [
  "Tables, indexes and streams become ACTIVE at once (AWS takes seconds); `--dynamodb-create-ms` and friends add AWS-like delays.",
  "A table's stream has one shard.",
  "Point-in-time recovery is always on.",
]
not_planned = [
  { why = "Global tables version 2017.11.29, superseded by replicas on the table itself; one machine has no second region to replicate to.", ops = ["CreateGlobalTable", "DescribeGlobalTable", "UpdateGlobalTable", "ListGlobalTables", "DescribeGlobalTableSettings", "UpdateGlobalTableSettings", "DescribeTableReplicaAutoScaling", "UpdateTableReplicaAutoScaling"] },
  { why = "Vector search over a table is new and not yet in use by the local-development tools doze-aws serves.", ops = ["SearchVectors"] },
]

[api."S3"]
differences = [
  "Lifecycle transitions are kept and not acted on: there is one storage class on disk.",
]
not_planned = [
  { why = "S3 Express One Zone directory buckets.", ops = ["CreateSession", "ListDirectoryBuckets", "RenameObject"] },
  { why = "S3 Object Lambda, BitTorrent and S3 Metadata tables, which need services doze-aws does not run.", ops = ["WriteGetObjectResponse", "GetObjectTorrent", "CreateBucketMetadataConfiguration", "GetBucketMetadataConfiguration", "DeleteBucketMetadataConfiguration", "CreateBucketMetadataTableConfiguration", "GetBucketMetadataTableConfiguration", "DeleteBucketMetadataTableConfiguration", "UpdateBucketMetadataInventoryTableConfiguration", "UpdateBucketMetadataJournalTableConfiguration"] },
  { why = "S3 Select is closed to new AWS customers; object annotations, ABAC and in-place encryption changes are new features with no local use yet.", ops = ["SelectObjectContent", "PutObjectAnnotation", "GetObjectAnnotation", "ListObjectAnnotations", "DeleteObjectAnnotation", "UpdateBucketMetadataAnnotationTableConfiguration", "GetBucketAbac", "PutBucketAbac", "UpdateObjectEncryption"] },
]

[api."SNS"]
differences = [
  "SMS, email and mobile push are accepted and sent nowhere.",
]
not_planned = [
  { why = "The SMS sandbox and origination numbers: no SMS is sent locally.", ops = ["CreateSMSSandboxPhoneNumber", "DeleteSMSSandboxPhoneNumber", "GetSMSSandboxAccountStatus", "ListSMSSandboxPhoneNumbers", "VerifySMSSandboxPhoneNumber", "ListOriginationNumbers"] },
]

[api."IAM"]
not_planned = [
