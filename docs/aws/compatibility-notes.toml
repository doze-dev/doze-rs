[api."ApiGatewayV2"]
not_planned = [
  { why = "Routing rules act on custom domains, which are kept but not served locally.", families = ["RoutingRule"] },
  { why = "Developer portals (hosted documentation sites).", families = ["Portal", "ProductPage", "ProductRestEndpointPage"] },
]

[api."EventBridge"]
differences = [
  "A replay starts one second after `StartReplay` and then puts back 100 events every 250 ms. AWS gives no pace (it typically takes minutes to start); this one is long enough to cancel with `CancelReplay` and short enough to wait for.",
]
not_planned = [
  { why = "SaaS partner event sources: events from third-party partners' accounts.", families = ["EventSource", "PartnerEvent"] },
  { why = "Global endpoints fail over between two regions' event buses with Route 53 health checks.", ops = ["CreateEndpoint", "DescribeEndpoint", "ListEndpoints", "UpdateEndpoint", "DeleteEndpoint"] },
]

[api."Lambda"]
differences = [
  "Functions run as processes on this machine with the runtime's own interpreter (python3, node, ruby...), not in containers. Container-image functions are stored and cannot be invoked.",
  "Event source mappings poll SQS, Kinesis and DynamoDB Streams.",
  "Durable functions run with AWS's durable execution SDKs unchanged: checkpoints, replay, waits, step retries, callbacks, child contexts, map and parallel, chained invokes. Waits take real time unless `DOZE_LAMBDA_DURABLE_WAIT_SCALE` shortens them (0.01 makes an hour 36 seconds). The `KMSKeyArn` of a `DurableConfig` is stored, and payloads are not encrypted with it.",
  "A durable invocation that fails without an answer from the SDK (a crash, a timeout) is tried three times, one and two seconds apart, before the execution fails; AWS's retry policy for these is not recorded.",
  "Deleting a function deletes its durable executions. A chained invoke that was under way when doze-aws stopped is made again when it starts.",
  "Durable execution error messages that AWS's own local checkpoint server (`@aws/durable-execution-sdk-js-testing`) does not state are doze's words, not recorded ones.",
]
not_planned = [
  { why = "Lambda Managed Instances run functions on EC2 capacity providers.", families = ["CapacityProvider", "FunctionScalingConfig"] },
  { why = "Deprecated by AWS; `Invoke` with `InvocationType=Event` does the same.", ops = ["InvokeAsync"] },
]

[api."STS"]
not_planned = [
  { why = "Tokens for outbound web-identity federation and partner delegation, which pair with IAM features not planned.", ops = ["GetWebIdentityToken", "GetDelegatedAccessToken"] },
]

[api."Kinesis"]
differences = [
  "A registered stream consumer is `ACTIVE` at once (AWS takes seconds). `SubscribeToShard` is answered on the connection it came on (boto3's HTTP/1.1 included; AWS documents HTTP/2), with no per-consumer throughput limit: a subscription is pushed records as soon as they are written, and an empty event at least every five seconds otherwise.",
]
not_planned = [
  { why = "Kinesis channels and record distribution strategies are new features with no local use yet.", ops = ["CreateChannel", "DeleteChannel", "DescribeChannel", "ListChannels", "UpdateChannel", "UpdateStreamRecordDistributionStrategy"] },
]

[api."CloudWatch"]
differences = [
  "Metric math is worked out in `GetMetricData` and in metric math alarms: arithmetic, comparisons and logic, `ABS CEIL FLOOR LOG LOG10`, `AVG SUM MIN MAX STDDEV`, `DATAPOINT_COUNT`, `PERIOD`, `TIME_SERIES`, `IF`, `METRICS`, `REMOVE_EMPTY FIRST LAST SORT SLICE`, `FILL RATE DIFF DIFF_TIME RUNNING_SUM`, the time functions and `SEARCH`. Metrics Insights queries (`SELECT ...`) and `INSIGHT_RULE_METRIC`, `SERVICE_QUOTA`, `LAMBDA` and `DB_PERF_INSIGHTS` are refused with a sentence.",
  "`ANOMALY_DETECTION_BAND` is a statistical stand-in, not AWS's trained model: the mean of the metric's datapoints in the window read (for an alarm, its window and up to 50 periods before it), plus and minus the given number of standard deviations.",
  "`SEARCH` matches a partial term as a case-insensitive part of a namespace, metric name or dimension; AWS matches on the words of a name. A search finds a metric as soon as it has data; AWS can take minutes to index a new one.",
  "Log alarms (`PutLogAlarm`) run their Logs Insights query on its `rate()` schedule against the local CloudWatch Logs and are judged M out of N on the results. No scheduled query appears in CloudWatch Logs for them, and the query role is not assumed. A run with several contributors (`... by host`) counts as breaching when any contributor does: contributors are not judged one by one, and `PARTIAL_DATA` is never reported.",
  "Composite alarms are judged on their rule as soon as they are made and whenever an alarm they name changes. `ActionsSuppressor` is kept and shown but never suppresses an action. Deleting an alarm that a composite names is accepted; the composite then finds it in no state.",
]
not_planned = [
  { why = "Datasets, vended-metric configuration, OpenTelemetry enrichment, managed Contributor Insights rules, alarm contributors and rendered graph images: features of AWS's own console and services, with no local use yet.", families = ["Dataset", "ResourceMetricsConfiguration", "OTelEnrichment", "ManagedInsightRules", "AlarmContributors", "MetricWidgetImage"] },
]
