[package]
name = "aws-dynamodb-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aws-dynamodb = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_partiql"
path = "fuzz_targets/fuzz_partiql.rs"
test = false
doc = false
