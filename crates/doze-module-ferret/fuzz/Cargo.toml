[package]
name = "doze-module-ferret-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Not part of the main workspace: fuzzing needs a nightly toolchain. The module is a binary crate, so the parsers are
# included by path.
[workspace]

[[bin]]
name = "fuzz_bson"
path = "fuzz_targets/fuzz_bson.rs"
test = false
doc = false

[[bin]]
name = "fuzz_reply"
path = "fuzz_targets/fuzz_reply.rs"
test = false
doc = false
