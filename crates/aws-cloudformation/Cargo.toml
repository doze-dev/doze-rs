[package]
name = "aws-cloudformation"
version = "0.0.0"
description = "CloudFormation: templates (JSON and YAML), intrinsics, SAM, stacks, change sets and rollback, provisioned through the other services' own operations"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-cloudformation = { path = "../aws-model-cloudformation" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-seal = { path = "../aws-seal" }
aws-peers = { path = "../aws-peers" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
hmac = "0.13"
tracing = "0.1"
regex-lite = "0.1"
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
aws-sqs = { path = "../aws-sqs" }
aws-sns = { path = "../aws-sns" }
aws-ssm = { path = "../aws-ssm" }
aws-kms = { path = "../aws-kms" }
aws-secrets = { path = "../aws-secrets" }
aws-s3 = { path = "../aws-s3" }
aws-iam = { path = "../aws-iam" }
aws-dynamodb = { path = "../aws-dynamodb" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync"] }
