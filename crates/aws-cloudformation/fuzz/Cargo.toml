[package]
name = "aws-cloudformation-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aws-cloudformation = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_yaml"
path = "fuzz_targets/fuzz_yaml.rs"
test = false
doc = false
