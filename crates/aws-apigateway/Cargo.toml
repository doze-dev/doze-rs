[package]
name = "aws-apigateway"
version = "0.0.0"
description = "API Gateway: REST APIs (v1), HTTP and WebSocket APIs (v2), and the execute-api plane that serves them"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-api-gateway = { path = "../aws-model-api-gateway" }
aws-model-apigatewayv2 = { path = "../aws-model-apigatewayv2" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-auth = { path = "../aws-auth" }
aws-peers = { path = "../aws-peers" }
aws-iam-policy = { path = "../aws-iam-policy" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
# Selection patterns, `replaceAll` in templates and `pattern` in models; already linked by aws-schema.
regex-lite = "0.1"
# Ids are random; getrandom is already linked (request ids, KMS).
getrandom = "0.4"
# The WebSocket handshake hashes with SHA-1 (RFC 6455); a JWT is verified with RSA (RS256) over the SHA-256 `rsa` re-exports. Both are already
# linked by KMS.
sha1 = "0.11"
rsa = { version = "=0.10.0-rc.22", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tracing = "0.1"

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync", "net", "io-util"] }

[dev-dependencies.aws-gateway]
path = "../aws-gateway"
