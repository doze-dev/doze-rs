[package]
name = "aws-apigateway"
version = "0.0.0"
description = "API Gateway: REST APIs (v1), HTTP and WebSocket APIs (v2), and the execute-api plane that serves them"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-api-gateway = { path = "../aws-model-api-gateway" }
aws-model-apigatewayv2 = { path = "../aws-model-apigatewayv2" }
aws-model-apigatewaymanagementapi = { path = "../aws-model-apigatewaymanagementapi" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-auth = { path = "../aws-auth" }
aws-peers = { path = "../aws-peers" }
aws-iam-policy = { path = "../aws-iam-policy" }
aws-webhook = { path = "../aws-webhook" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a generated model template lists the properties in the schema's order, as AWS does (recorded 2026-11-19). The
# doze-aws binary already links it (jlens-core, through aws-asl); naming it here keeps the crate's own build the same.
serde_json = { version = "1", features = ["preserve_order"] }
bytes = "1"
# Selection patterns, `replaceAll` in templates and `pattern` in models; already linked by aws-schema.
regex-lite = "0.1"
# Ids are random; getrandom is already linked (request ids, KMS).
getrandom = { version = "0.4", features = ["sys_rng"] }
# Client certificates: an RSA 2048 key and its PKCS #1 v1.5 SHA-256 signature, with the features KMS already links (no new crate).
rsa = { version = "=0.10.0-rc.22", default-features = false, features = ["std", "encoding", "getrandom", "pkcs1v15"] }
# The WebSocket handshake hashes with SHA-1 (RFC 6455); already linked by KMS. A JWT is verified by aws-webhook's `jwt`.
sha1 = "0.11"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tracing = "0.1"

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
aws-webhook = { path = "../aws-webhook", features = ["test-server"] }
aws-logs = { path = "../aws-logs" }
# The tests sign tokens with a fixed RSA key.
rsa = { version = "=0.10.0-rc.22", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync", "net", "io-util"] }

[dev-dependencies.aws-gateway]
path = "../aws-gateway"
