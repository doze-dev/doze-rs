[package]
name = "aws-cloudwatch-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aws-cloudwatch = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_metric_math"
path = "fuzz_targets/fuzz_metric_math.rs"
test = false
doc = false

[[bin]]
name = "fuzz_alarm_rule"
path = "fuzz_targets/fuzz_alarm_rule.rs"
test = false
doc = false
