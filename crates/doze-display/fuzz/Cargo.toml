[package]
name = "doze-display-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
doze-display = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_clean"
path = "fuzz_targets/fuzz_clean.rs"
test = false
doc = false

[[bin]]
name = "fuzz_level"
path = "fuzz_targets/fuzz_level.rs"
test = false
doc = false

[[bin]]
name = "fuzz_number"
path = "fuzz_targets/fuzz_number.rs"
test = false
doc = false
