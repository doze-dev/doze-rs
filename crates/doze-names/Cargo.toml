[package]
name = "doze-names"
version = "0.0.0"
description = ".doze, the local naming zone every doze program shares: names, addresses, the registry, the resolver, the front door"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
doze-os = { path = "../doze-os" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std", "getrandom"] }
sha2 = "0.11"
x509-cert = { version = "0.3", features = ["builder", "pem", "std"] }
hex = "0.4"
getrandom = "0.3"
hyper = { version = "1", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio = { version = "1.54", features = ["net", "rt", "time", "sync", "macros", "io-util"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["net", "rt", "rt-multi-thread", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
