[package]
name = "kafka-meta"
version = "0.0.0"
description = "Broker metadata store: topics, offsets, producer ids, transactions, ACLs"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kafka-wire = { path = "../kafka-wire" }
kafka-storage = { path = "../kafka-storage" }
# Pinned to the minor: the file format is redb's, and a new version is a decision (docs/port/weight.md).
redb = "=4.5.0"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "2"
getrandom = "0.4"

[dev-dependencies]
# The crash tests run the store on the simulated disk.
kafka-storage = { path = "../kafka-storage", features = ["sim"] }
