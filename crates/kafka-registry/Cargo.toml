[package]
name = "kafka-registry"
version = "0.0.0"
description = "Confluent-compatible schema registry"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The registry served over TLS with the broker's certificate (`--schema-registry-tls`). Off by default, like the broker's.
tls = ["dep:tokio-rustls"]

# Every dependency below is already in the default doze-kafka build (docs/port/phase10.md, "Weight"): the registry adds
# no package of its own. The schema languages are written here, not taken from apache-avro (+35 packages), protox and
# prost-reflect (+25) or jsonschema (+76).
[dependencies]
kafka-meta = { path = "../kafka-meta" }
# The allowed-hosts guard the console uses too.
kafka-auth = { path = "../kafka-auth" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
# The stored records: a version byte and postcard, as the broker's own metadata.
postcard = { version = "1", default-features = false, features = ["alloc"] }
# The fingerprint a schema is found again by.
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
tracing = "0.1"
bytes = "1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }

[dev-dependencies]
kafka-storage = { path = "../kafka-storage", features = ["sim"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
