[package]
name = "kafka-server"
version = "0.0.0"
description = "Listener, TLS, connection tasks, sessions and shutdown: the Server handle"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# TLS on the listener (docs/port/phase8.md, D2). Off by default: ring is the first C-compiled dependency and the
# crates cost about 0.9 MB and 12 packages (docs/port/weight.md). Without it the config has no TLS field at all.
tls = ["dep:rustls", "dep:tokio-rustls"]

[dependencies]
kafka-auth = { path = "../kafka-auth" }
kafka-wire = { path = "../kafka-wire" }
kafka-broker = { path = "../kafka-broker" }
kafka-storage = { path = "../kafka-storage" }
bytes = "1"
thiserror = "2"
tracing = "0.1"
# The runtime flavour is the binary's choice; this crate needs the pieces, not the threads.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# Only with `tls`. The feature set is the one measured in docs/port/phase8/prior-art-weight.md: no logging, no
# aws-lc-rs, ring as the provider (named in the code, not installed as the process default), TLS 1.2 and 1.3.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }

[dev-dependencies]
kafka-auth = { path = "../kafka-auth", features = ["client"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
kafka-protocol = { version = "0.18", default-features = false, features = ["client"] }
kafka-storage = { path = "../kafka-storage", features = ["sim"] }
kafka-wire = { path = "../kafka-wire", features = ["test-support"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "sync", "macros", "test-util"] }
