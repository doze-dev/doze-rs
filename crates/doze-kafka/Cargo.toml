[package]
name = "doze-kafka"
version = "0.0.0"
description = "A Kafka broker for local development: one binary, single node, disk-backed"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# TLS on the Kafka listener: --tls-cert and --tls-key. Off by default (weight is a feature); building it needs a C
# compiler and assembler because of ring. See docs/port/weight.md.
tls = ["kafka-server/tls", "dep:rustls", "kafka-registry?/tls"]
# The web console, served beside the broker (`--console`, on by default). On in the default build: the owner's decision of
# 2026-11-12 (docs/port/phase9.md, D1). `--no-default-features` is the lean broker with no HTTP in it at all.
console = ["dep:kafka-console"]
# The Confluent-compatible schema registry, served beside the broker (`--schema-registry`, on by default, as in the Go edition).
# Its HTTP stack is the console's (hyper), so it adds no package to the default build (docs/port/phase10.md, "Weight").
registry = ["dep:kafka-registry"]
# The doze module face (docs/port/phase11.md): run as `kafka-plugin` (the name a module release packages it under) or as
# `doze-kafka module`, the binary speaks doze's module protocol 2 and plans itself as the engine. On in the default build,
# like the console; `--no-default-features` leaves it out.
module = ["dep:doze-module", "dep:doze-os", "dep:kafka-protocol", "dep:bytes"]
default = ["console", "module", "registry"]

[dependencies]
kafka-auth = { path = "../kafka-auth" }
kafka-wire = { path = "../kafka-wire" }
kafka-storage = { path = "../kafka-storage" }
kafka-broker = { path = "../kafka-broker" }
kafka-server = { path = "../kafka-server" }
kafka-console = { path = "../kafka-console", optional = true }
kafka-registry = { path = "../kafka-registry", optional = true }
doze-runtime = { path = "../doze-runtime" }
anyhow = "1"
# The limit on open files: raised at start, and the open partitions sized to it.
rlimit = "0.11"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
# Only for the tests of a build with `tls` (a client to the TLS port); the binary reaches rustls through kafka-server.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
# Two worker threads by default (weight is a feature), and the signals a stop arrives by.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "signal", "net", "time", "macros"] }
# The module face (feature `module`): the SDK, and the client side of the Kafka messages it speaks to its own broker with.
doze-module = { path = "../doze-module", optional = true }
doze-os = { path = "../doze-os", optional = true }
kafka-protocol = { version = "0.18", default-features = false, features = ["client"], optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
doze-module-test = { path = "../doze-module-test" }
doze-module-host = { path = "../doze-module-host" }
doze-module-proto = { path = "../doze-module-proto" }
serde_json = "1"
kafka-auth = { path = "../kafka-auth", features = ["client"] }
kafka-wire = { path = "../kafka-wire", features = ["test-support"] }
kafka-protocol = { version = "0.18", default-features = false, features = ["client"] }
bytes = "1"
