[package]
name = "doze-kafka"
version = "0.0.0"
description = "A Kafka broker for local development: one binary, single node, disk-backed"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# TLS on the Kafka listener: --tls-cert and --tls-key. Off by default (weight is a feature); building it needs a C
# compiler and assembler because of ring. See docs/port/weight.md.
tls = ["kafka-server/tls", "dep:rustls"]
# The web console, served beside the broker (`--console`, on by default). On in the default build: the owner's decision of
# 2026-11-12 (docs/port/phase9.md, D1). `--no-default-features` is the lean broker with no HTTP in it at all.
console = ["dep:kafka-console"]
default = ["console"]

[dependencies]
kafka-auth = { path = "../kafka-auth" }
kafka-wire = { path = "../kafka-wire" }
kafka-storage = { path = "../kafka-storage" }
kafka-broker = { path = "../kafka-broker" }
kafka-server = { path = "../kafka-server" }
kafka-console = { path = "../kafka-console", optional = true }
kafka-registry = { path = "../kafka-registry" }
doze-runtime = { path = "../doze-runtime" }
anyhow = "1"
# The limit on open files: raised at start, and the open partitions sized to it.
rlimit = "0.11"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
# Only for the tests of a build with `tls` (a client to the TLS port); the binary reaches rustls through kafka-server.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
# Two worker threads by default (weight is a feature), and the signals a stop arrives by.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "signal", "net", "time", "macros"] }

[dev-dependencies]
kafka-auth = { path = "../kafka-auth", features = ["client"] }
kafka-wire = { path = "../kafka-wire", features = ["test-support"] }
kafka-protocol = { version = "0.18", default-features = false, features = ["client"] }
bytes = "1"
