[package]
name = "aws-scheduler"
version = "0.0.0"
description = "EventBridge Scheduler: schedules and schedule groups, rate/cron/at in IANA time zones, delivered to templated and universal targets as the schedule's role"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-scheduler = { path = "../aws-model-scheduler" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-cron = { path = "../aws-cron" }
aws-peers = { path = "../aws-peers" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde_json = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
aws-sqs = { path = "../aws-sqs" }
aws-iam = { path = "../aws-iam" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync"] }
