[package]
name = "aws-auth-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
http = "1"
aws-auth = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_claim"
path = "fuzz_targets/fuzz_claim.rs"
test = false
doc = false

[[bin]]
name = "fuzz_chunked"
path = "fuzz_targets/fuzz_chunked.rs"
test = false
doc = false
