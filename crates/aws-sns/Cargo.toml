[package]
name = "aws-sns"
version = "0.0.0"
description = "SNS: topics, subscriptions, filter policies and fan-out to SQS, as a state machine behind a lazy actor per region"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-sns = { path = "../aws-model-sns" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-seal = { path = "../aws-seal" }
aws-peers = { path = "../aws-peers" }
aws-iam-policy = { path = "../aws-iam-policy" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
aws-webhook = { path = "../aws-webhook" }
bytes = "1"
tokio = { version = "1", default-features = false, features = ["time", "macros"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
aws-sqs = { path = "../aws-sqs" }
aws-gateway = { path = "../aws-gateway" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync", "net", "io-util"] }
