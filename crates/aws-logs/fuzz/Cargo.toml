[package]
name = "aws-logs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aws-logs = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_filter_pattern"
path = "fuzz_targets/fuzz_filter_pattern.rs"
test = false
doc = false
