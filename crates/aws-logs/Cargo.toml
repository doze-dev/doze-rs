[package]
name = "aws-logs"
version = "0.0.0"
description = "CloudWatch Logs: log groups, streams and events with filter patterns, retention, tags, and metric and subscription filters, behind a lazy actor"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-cloudwatch-logs = { path = "../aws-model-cloudwatch-logs" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-cron = { path = "../aws-cron" }
aws-peers = { path = "../aws-peers" }
aws-seal = { path = "../aws-seal" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tracing = "0.1"
regex-lite = "0.1"
# `rt` runs Insights queries on the blocking pool; `time` paces Live Tail updates (only while a session is open); `macros` selects.
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time", "macros"] }
bytes = "1"
# `@logStreamId` holds the SHA-256 of the stream's name (already in the binary through aws-auth).
sha2 = "0.11"

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync"] }
