[package]
name = "aws-logs"
version = "0.0.0"
description = "CloudWatch Logs: log groups, streams and events with filter patterns, retention, tags, and metric and subscription filters, behind a lazy actor"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-cloudwatch-logs = { path = "../aws-model-cloudwatch-logs" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-peers = { path = "../aws-peers" }
aws-seal = { path = "../aws-seal" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync"] }
