[package]
name = "aws-ssm"
version = "0.0.0"
description = "SSM: Parameter Store, public parameters, documents and service settings, as a state machine behind a lazy actor"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-ssm = { path = "../aws-model-ssm" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-yaml = { path = "../aws-yaml" }
sha2 = "0.11"
aws-core = { path = "../aws-core" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
aws-peers = { path = "../aws-peers" }
aws-iam-policy = { path = "../aws-iam-policy" }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync"] }
aws-testkit = { path = "../aws-testkit" }
aws-kms = { path = "../aws-kms" }
aws-secrets = { path = "../aws-secrets" }
serde_json = "1"
