[package]
name = "doze-fs"
version = "0.0.0"
description = "The file-system seam: the Fs trait, the real disk, and a simulated disk with crash points and faults"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A deterministic in-memory disk with crash points and injected faults, for tests.
sim = []

# The size and room of a volume (`Fs::space`, statvfs). Already in the tree with `fs` (doze-os); safe, so no `unsafe` here.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
doze-fs = { path = ".", features = ["sim"] }
