[package]
name = "aws-webhook"
version = "0.0.0"
description = "The outbound HTTP/1.1 client the services share (SNS http/https subscriptions, EventBridge API destinations, API Gateway HTTP integrations), and the JSON Web Tokens verified against keys it fetches (API Gateway's JWT authorizer, STS's AssumeRoleWithWebIdentity): plain TCP or TLS (rustls, the OS trust store)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A TLS test server with a generated CA (for the tests of the crates that call out); never in a release build.
test-server = ["dep:rcgen"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "net", "io-util", "time"] }
tracing = "0.1"
# TLS: the provider doze-kafka and doze-names already use (ring), the tokio adapter, and the OS trust store (read once, lazily,
# on the first https call). Size: xtask/weight-limits.txt, 2026-11-14 (tls).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"], optional = true }
# JSON Web Tokens (jwt.rs, jwks.rs): RSA and the NIST curves, all already linked by KMS (and RSA by API Gateway before this moved
# here), so no crate is added to the binary.
aws-core = { path = "../aws-core" }
serde_json = "1"
rsa = { version = "=0.10.0-rc.22", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p521 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }

# The OS store on Linux and Windows. Not on macOS: there the keychains are listed with /usr/bin/security (os_roots.rs), so the
# binary does not link Security.framework and CoreFoundation (their idle cost: xtask/weight-limits.txt, tls2).
[target.'cfg(not(target_os = "macos"))'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "time"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
