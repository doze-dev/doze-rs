[package]
name = "aws-webhook"
version = "0.0.0"
description = "The one outbound HTTP request the services make (EventBridge API destinations, SNS http subscriptions): HTTP/1.1, plain TCP, status only"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "time"] }
