[package]
name = "aws-secrets-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aws-secrets = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_resource_policy"
path = "fuzz_targets/fuzz_resource_policy.rs"
test = false
doc = false
