[package]
name = "aws-secrets"
version = "0.0.0"
description = "Secrets Manager: secrets, versions and staging labels, as a state machine behind a lazy actor"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-secrets-manager = { path = "../aws-model-secrets-manager" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-seal = { path = "../aws-seal" }
aws-peers = { path = "../aws-peers" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
aws-kms = { path = "../aws-kms" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync"] }
