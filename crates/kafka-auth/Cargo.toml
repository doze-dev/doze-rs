[package]
name = "kafka-auth"
version = "0.0.0"
description = "Sans-IO authentication for the Kafka broker: principals, SASL/PLAIN and the crypto under it"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
thiserror = "2"
# The server nonce and the salts of the verifiers (already in the build through the broker).
getrandom = "0.4"

[features]
# A SCRAM client, for the tests of the crates that use this one. Off in a release build.
client = []

[dev-dependencies]
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
