[package]
name = "aws-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aws-core = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_rfc3339"
path = "fuzz_targets/fuzz_rfc3339.rs"
test = false
doc = false
