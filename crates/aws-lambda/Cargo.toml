[package]
name = "aws-lambda"
version = "0.0.0"
description = "Lambda: functions as supervised host processes behind the Runtime API, versions, aliases, layers, URLs, event source mappings"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-lambda = { path = "../aws-model-lambda" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-peers = { path = "../aws-peers" }
aws-seal = { path = "../aws-seal" }
aws-iam-policy = { path = "../aws-iam-policy" }
aws-kinesis = { path = "../aws-kinesis" }
aws-dynamodb = { path = "../aws-dynamodb" }
aws-sqs = { path = "../aws-sqs" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
bytes = "1"
# The zip reader inflates with flate2 and checks entries with crc32fast; both are already linked (gzip request bodies).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "net", "process", "io-util", "macros", "fs"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"

# A function process's group is signalled directly (it was a `kill(1)` child per process end), and its output pipes are asked how
# much is unread (FIONREAD) so an invocation's lines are taken without sleeping. rustix with `process` is already in the binary
# (doze-os, through doze-module), and it is safe, so no `unsafe` here: docs/port/weight.md, "Workstream 4".
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
aws-gateway = { path = "../aws-gateway" }
aws-logs = { path = "../aws-logs" }
aws-cloudwatch = { path = "../aws-cloudwatch" }
aws-iam = { path = "../aws-iam" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync", "net", "io-util", "process"] }
