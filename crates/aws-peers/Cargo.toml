[package]
name = "aws-peers"
version = "0.0.0"
description = "A typed in-process bus between AWS services: one service calls another's operation without a socket"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
serde_json = "1"
aws-core = { path = "../aws-core" }
aws-seal = { path = "../aws-seal" }
bytes = "1"
# The lazy services of a host (`Rests`): the console's Lab tells one to rest through the bus it already holds.
doze-runtime = { path = "../doze-runtime" }
# A task-local (`seen`): what caused a bus call travels with the task that makes it, so no service passes it by hand.
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
aws-kms = { path = "../aws-kms" }
aws-model-dynamodb = { path = "../aws-model-dynamodb" }
aws-model-eventbridge = { path = "../aws-model-eventbridge" }
aws-model-s3 = { path = "../aws-model-s3" }
aws-model-sfn = { path = "../aws-model-sfn" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync"] }
