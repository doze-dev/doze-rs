[package]
name = "aws-iam-policy-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aws-iam-policy = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_policy_document"
path = "fuzz_targets/fuzz_policy_document.rs"
test = false
doc = false
