[package]
name = "aws-iam"
version = "0.0.0"
description = "IAM and STS: the identities of an account, their policies and keys, and the sessions roles give out"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-iam = { path = "../aws-model-iam" }
aws-model-sts = { path = "../aws-model-sts" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-peers = { path = "../aws-peers" }
aws-auth = { path = "../aws-auth" }
tracing = "0.1"
aws-core = { path = "../aws-core" }
aws-seal = { path = "../aws-seal" }
aws-iam-policy = { path = "../aws-iam-policy" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
# Already in the binary (S3 and KMS): `AssumeRoleWithSAML`'s NameQualifier is a SHA-1.
sha1 = "0.11"
# Already in the binary (KMS keys, API Gateway's JWTs): a SAML assertion's signature is PKCS#1 v1.5 RSA.
rsa = { version = "=0.10.0-rc.22", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
# Already in the binary (KMS), with the same features: a server certificate's EC private key is checked against the certificate.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
# Already in the binary (S3, SQS): an SSH public key's fingerprint is its MD5.
md-5 = "0.11"
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
# `AssumeRoleWithWebIdentity` verifies a token against its issuer's keys, fetched with the outbound client API Gateway uses.
aws-webhook = { path = "../aws-webhook" }

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
aws-webhook = { path = "../aws-webhook", features = ["test-server"] }
# The tests sign web identity tokens with a fixed ES256 key.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync"] }
