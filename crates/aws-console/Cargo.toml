[package]
name = "aws-console"
version = "0.0.0"
description = "The doze-aws web console: its own listener, the embedded React app, the JSON API over view-models, the Live ring"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The Observer the Live ring implements: the dependency points from the console to the gateway, never back.
aws-gateway = { path = "../aws-gateway" }
# The Service trait (`/api/v1/services` counts each API's operations on the services themselves, as `doze-aws compat` does).
aws-wire = { path = "../aws-wire" }
# The bus's call watcher (the Live record is told about calls between services too) and its table of resource members.
aws-peers = { path = "../aws-peers" }
# base64, for the payload and log of a function invoked from its page.
aws-core = { path = "../aws-core" }
# SigV4's primitives, to sign an object's presigned link (already in the binary through the gateway).
aws-auth = { path = "../aws-auth" }
# A model's protocol, operations and addresses, for a call written out as a command (`api/copy.rs`).
aws-schema = { path = "../aws-schema" }
# Only `hostguard` (the DNS-rebinding guard on the Host header): generic, and fuzzed there. It should move to a crate both
# consoles share; until then this is the one copy.
kafka-auth = { path = "../kafka-auth" }
# The HTTP server and router, as doze-kafka's console: no default features (no macros, no json, no query, no tracing, no HTTP/2).
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
# The embedded text assets are gzip; a client that does not accept gzip is sent them inflated. The gateway's own backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
# The connection loop (a header-read timeout and a cap on connections need hyper's own server, which axum::serve does not expose).
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "service"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"

[dev-dependencies]
# The models the Lab's error table is checked against (src/lab/codes/tests.rs): every shape it names is in the model of its service.
aws-model-api-gateway = { path = "../aws-model-api-gateway" }
aws-model-apigatewaymanagementapi = { path = "../aws-model-apigatewaymanagementapi" }
aws-model-apigatewayv2 = { path = "../aws-model-apigatewayv2" }
aws-model-cloudformation = { path = "../aws-model-cloudformation" }
aws-model-cloudwatch = { path = "../aws-model-cloudwatch" }
aws-model-cloudwatch-logs = { path = "../aws-model-cloudwatch-logs" }
aws-model-dynamodb = { path = "../aws-model-dynamodb" }
aws-model-dynamodb-streams = { path = "../aws-model-dynamodb-streams" }
aws-model-eventbridge = { path = "../aws-model-eventbridge" }
aws-model-iam = { path = "../aws-model-iam" }
aws-model-kinesis = { path = "../aws-model-kinesis" }
aws-model-kms = { path = "../aws-model-kms" }
aws-model-lambda = { path = "../aws-model-lambda" }
aws-model-s3 = { path = "../aws-model-s3" }
aws-model-scheduler = { path = "../aws-model-scheduler" }
aws-model-secrets-manager = { path = "../aws-model-secrets-manager" }
aws-model-sfn = { path = "../aws-model-sfn" }
aws-model-sns = { path = "../aws-model-sns" }
aws-model-sqs = { path = "../aws-model-sqs" }
aws-model-ssm = { path = "../aws-model-ssm" }
aws-model-sts = { path = "../aws-model-sts" }
# TypeScript types of the JSON API, written by a test into console/apps/aws/src/api/types (a stale file fails the test).
ts-rs = "12"
# A real service to count operations on, and the services the Resources descriptors are tested against (tests/resources.rs).
aws-sqs = { path = "../aws-sqs" }
aws-sns = { path = "../aws-sns" }
aws-s3 = { path = "../aws-s3" }
aws-dynamodb = { path = "../aws-dynamodb" }
aws-lambda = { path = "../aws-lambda" }
aws-secrets = { path = "../aws-secrets" }
aws-ssm = { path = "../aws-ssm" }
aws-kms = { path = "../aws-kms" }
aws-iam = { path = "../aws-iam" }
aws-kinesis = { path = "../aws-kinesis" }
aws-logs = { path = "../aws-logs" }
aws-cloudwatch = { path = "../aws-cloudwatch" }
aws-eventbridge = { path = "../aws-eventbridge" }
aws-scheduler = { path = "../aws-scheduler" }
aws-sfn = { path = "../aws-sfn" }
aws-apigateway = { path = "../aws-apigateway" }
aws-cloudformation = { path = "../aws-cloudformation" }
doze-runtime = { path = "../doze-runtime" }
# `oneshot` on a Router, and the bodies of its answers.
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "test-util"] }
tempfile = "3"
