[package]
name = "doze-projects"
version = "0.0.0"
description = "Read-only reader of the Go doze project records (projects/*/project.json), stack keys, daemon discovery and the stale-pid check"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
doze-os = { path = "../doze-os" }
sha2 = "0.11"
hex = "0.4"
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
time = { version = "0.3", features = ["parsing", "formatting"] }

[dev-dependencies]
tempfile = "3"
