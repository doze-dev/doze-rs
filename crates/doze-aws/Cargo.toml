[package]
name = "doze-aws"
version = "0.0.0"
description = "Local AWS for development: the binary"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The doze module face (docs/port/modules/PLAN.md step 15): run as `aws-plugin` (the name a module release packages it under) or
# as `doze-aws module`, the binary speaks doze's module protocol 2 and plans itself as the engine. On in the default build, as
# kafka's is; `--no-default-features` leaves it out.
module = ["dep:doze-module", "dep:doze-bolt"]
default = ["module"]

[dependencies]
aws-auth = { path = "../aws-auth" }
aws-gateway = { path = "../aws-gateway" }
# The web console (`--console`): its own listener, and the Live ring the gateway feeds.
aws-console = { path = "../aws-console" }
aws-sqs = { path = "../aws-sqs" }
aws-ssm = { path = "../aws-ssm" }
aws-secrets = { path = "../aws-secrets" }
aws-kms = { path = "../aws-kms" }
aws-dynamodb = { path = "../aws-dynamodb" }
aws-dynamodb-streams = { path = "../aws-dynamodb-streams" }
aws-s3 = { path = "../aws-s3" }
aws-iam = { path = "../aws-iam" }
aws-sns = { path = "../aws-sns" }
aws-kinesis = { path = "../aws-kinesis" }
aws-logs = { path = "../aws-logs" }
aws-cloudwatch = { path = "../aws-cloudwatch" }
aws-eventbridge = { path = "../aws-eventbridge" }
aws-scheduler = { path = "../aws-scheduler" }
aws-lambda = { path = "../aws-lambda" }
aws-apigateway = { path = "../aws-apigateway" }
aws-sfn = { path = "../aws-sfn" }
aws-cloudformation = { path = "../aws-cloudformation" }
aws-peers = { path = "../aws-peers" }
aws-wire = { path = "../aws-wire" }
aws-webhook = { path = "../aws-webhook" }
aws-schema = { path = "../aws-schema" }
aws-core = { path = "../aws-core" }
doze-runtime = { path = "../doze-runtime" }
# `full_flush(false)` at start: a flush on macOS is fsync(2), as doze-kafka's (docs/port/weight.md, "Workstream 2").
doze-fs = { path = "../doze-fs" }
# The limit on open files, raised at start (doze-kafka's crate; it links only libc, already here: weight.md, "Workstream 2").
rlimit = "0.11"
# The module face (feature `module`).
doze-module = { path = "../doze-module", optional = true }
# Reading the bbolt files a Go doze-aws module left, to carry them over (module/godata).
doze-bolt = { path = "../doze-bolt", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
# Already in the tree (clap uses it): the nearest name to a typo in --services or doze-aws.toml.
strsim = "0.11"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# One thread (weight is a feature), and the signals a stop arrives by.
tokio = { version = "1", default-features = false, features = ["rt", "signal", "net", "time", "macros"] }

[dev-dependencies]
doze-module-test = { path = "../doze-module-test" }
doze-module-proto = { path = "../doze-module-proto", features = ["snapshot"] }
tempfile = "3"
# The names front door end to end (tests/names_front_door.rs): the zone's front door in the test, doze-aws behind it.
doze-names = { path = "../doze-names" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
crc32fast = "1"
