[package]
name = "doze-aws"
version = "0.0.0"
description = "Local AWS for development: the binary"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-auth = { path = "../aws-auth" }
aws-gateway = { path = "../aws-gateway" }
aws-sqs = { path = "../aws-sqs" }
aws-ssm = { path = "../aws-ssm" }
aws-secrets = { path = "../aws-secrets" }
aws-kms = { path = "../aws-kms" }
aws-dynamodb = { path = "../aws-dynamodb" }
aws-s3 = { path = "../aws-s3" }
aws-iam = { path = "../aws-iam" }
aws-sns = { path = "../aws-sns" }
aws-kinesis = { path = "../aws-kinesis" }
aws-logs = { path = "../aws-logs" }
aws-cloudwatch = { path = "../aws-cloudwatch" }
aws-peers = { path = "../aws-peers" }
aws-wire = { path = "../aws-wire" }
doze-runtime = { path = "../doze-runtime" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# One thread (weight is a feature), and the signals a stop arrives by.
tokio = { version = "1", default-features = false, features = ["rt", "signal", "net", "time", "macros"] }
