[package]
name = "doze-module-temporal"
version = "0.0.0"
description = "The temporal module: a local Temporal dev server, supervised, with its namespaces converged"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
doze-module = { path = "../doze-module" }
serde_json = "1"

[dev-dependencies]
doze-module-test = { path = "../doze-module-test" }
doze-module-proto = { path = "../doze-module-proto" }
doze-os = { path = "../doze-os" }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "macros", "net", "io-util", "time"] }

[[bin]]
name = "doze-module-temporal"
path = "src/main.rs"
doc = false
