[package]
name = "aws-kinesis"
version = "0.0.0"
description = "Kinesis Data Streams: streams, shards, records, iterators, consumers and tags, as a state machine behind a lazy actor"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-kinesis = { path = "../aws-model-kinesis" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-peers = { path = "../aws-peers" }
aws-seal = { path = "../aws-seal" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.11"
# The append notification: a counter that a poller waits on.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync"] }
