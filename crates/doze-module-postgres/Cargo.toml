[package]
name = "doze-module-postgres"
version = "0.0.0"
description = "The postgres module: a local PostgreSQL server, booted on first connect, with its roles, database, schemas, extensions and grants kept as declared"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
doze-module = { path = "../doze-module" }
doze-os = { path = "../doze-os" }
tokio = { version = "1.54", features = ["process", "io-util", "time"] }

[dev-dependencies]
doze-module-test = { path = "../doze-module-test" }
doze-module-proto = { path = "../doze-module-proto" }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "macros", "net", "io-util", "time"] }

[[bin]]
name = "doze-module-postgres"
path = "src/main.rs"
doc = false
