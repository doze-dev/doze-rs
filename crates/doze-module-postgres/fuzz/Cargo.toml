[package]
name = "doze-module-postgres-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"

# Not part of the main workspace: fuzzing needs a nightly toolchain. The module is a binary crate, so the parsers are
# included by path.
[workspace]

[[bin]]
name = "fuzz_names"
path = "fuzz_targets/fuzz_names.rs"
test = false
doc = false

[[bin]]
name = "fuzz_wire"
path = "fuzz_targets/fuzz_wire.rs"
test = false
doc = false

[[bin]]
name = "fuzz_rows"
path = "fuzz_targets/fuzz_rows.rs"
test = false
doc = false

[[bin]]
name = "fuzz_bundle"
path = "fuzz_targets/fuzz_bundle.rs"
test = false
doc = false
