[package]
name = "doze-desk-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
doze-desk = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_hcl_scan"
path = "fuzz_targets/fuzz_hcl_scan.rs"
test = false
doc = false
