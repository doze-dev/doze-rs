[package]
name = "doze-module"
version = "0.0.0"
description = "The SDK doze modules are written against: the Module trait, capability traits, #[derive(Spec)], helpers"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
doze-module-proto = { path = "../doze-module-proto" }
doze-module-derive = { path = "../doze-module-derive" }
doze-os = { path = "../doze-os" }
minicbor = { version = "2.3", features = ["derive", "std"] }
tokio = { version = "1.54", features = ["rt", "time", "process", "fs", "io-util", "net", "signal", "macros"] }

[dev-dependencies]
doze-module-test = { path = "../doze-module-test" }
doze-os = { path = "../doze-os" }
doze-module-host = { path = "../doze-module-host" }
tokio = { version = "1.54", features = ["rt", "time", "process", "macros", "net", "io-util"] }
doze-module-proto = { path = "../doze-module-proto" }

[[bin]]
# Test module only: the echo module tests/echo.rs drives through a real host peer.
name = "doze-module-echo"
path = "src/bin/echo.rs"
test = false
doc = false

[[bin]]
# The echo module's engine: echoes lines on the address the host grants.
name = "doze-module-echo-engine"
path = "src/bin/echo_engine.rs"
test = false
doc = false
