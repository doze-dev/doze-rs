[package]
name = "kafka-broker"
version = "0.0.0"
description = "Request handlers and the pure state machines: groups, transactions, idempotency, ACLs, SCRAM"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kafka-wire = { path = "../kafka-wire" }
kafka-storage = { path = "../kafka-storage" }
kafka-meta = { path = "../kafka-meta" }
thiserror = "2"
bytes = "1"
# Regular-expression topic subscriptions (ConsumerGroupHeartbeat v1): small, no dependencies.
regex-lite = "0.1"
# Member ids.
getrandom = "0.4"
# StreamMap waits on the end offsets of however many partitions a fetch reads.
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tracing = "0.1"
# Blocking file work in a handler must not stall the runtime thread it runs on.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
flate2 = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "test-util"] }
kafka-storage = { path = "../kafka-storage", features = ["sim"] }
kafka-wire = { path = "../kafka-wire", features = ["test-support"] }
