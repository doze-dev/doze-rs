[package]
name = "aws-sqs"
version = "0.0.0"
description = "SQS: queues and messages, as a state machine behind a lazy actor"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-sqs = { path = "../aws-model-sqs" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
doze-fs = { path = "../doze-fs" }
redb = "=4.5.0"
serde = { version = "1", features = ["derive"] }
aws-core = { path = "../aws-core" }
md-5 = "0.11"
sha2 = "0.11"
serde_json = "1"
getrandom = "0.4"

# Long polling: a timer and a wake-up (no runtime of its own).
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync"] }
