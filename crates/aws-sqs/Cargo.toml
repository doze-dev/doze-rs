[package]
name = "aws-sqs"
version = "0.0.0"
description = "SQS: queues and messages, as a state machine behind a lazy actor"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-sqs = { path = "../aws-model-sqs" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
doze-runtime = { path = "../doze-runtime" }
aws-core = { path = "../aws-core" }
md-5 = "0.11"
getrandom = "0.4"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
