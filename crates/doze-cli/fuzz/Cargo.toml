[package]
name = "doze-cli-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
doze-cli = { path = ".." }
doze-control = { path = "../../doze-control" }
serde_json = "1"

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_index"
path = "fuzz_targets/fuzz_index.rs"
test = false
doc = false

[[bin]]
name = "fuzz_meta"
path = "fuzz_targets/fuzz_meta.rs"
test = false
doc = false

[[bin]]
name = "fuzz_latest"
path = "fuzz_targets/fuzz_latest.rs"
test = false
doc = false

[[bin]]
name = "fuzz_lock"
path = "fuzz_targets/fuzz_lock.rs"
test = false
doc = false

[[bin]]
name = "fuzz_duration"
path = "fuzz_targets/fuzz_duration.rs"
test = false
doc = false

[[bin]]
name = "fuzz_argv"
path = "fuzz_targets/fuzz_argv.rs"
test = false
doc = false

[[bin]]
name = "fuzz_env"
path = "fuzz_targets/fuzz_env.rs"
test = false
doc = false

# The workspace's vendored, patched hcl-edit (vendor/hcl-edit/PATCHES.md), which doze-hcl needs.
[patch.crates-io]
hcl-edit = { path = "../../../vendor/hcl-edit" }
