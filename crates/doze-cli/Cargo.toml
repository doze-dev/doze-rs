[package]
name = "doze-cli"
version = "0.0.0"
description = "The doze command: the terminal's client of doze, as the app is (docs/port/cli/proposal.md)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "doze"
path = "src/main.rs"

[dependencies]
doze-os = { path = "../doze-os" }
# The zone: setup and trust (feature `setup`), and the network daemon dns-setup installs, which is this program run as
# `__doze-netd` (feature `netd`, part of `setup`).
doze-names = { path = "../doze-names", features = ["setup"] }
# What doctor checks and the one-prompt repair, as data.
doze-doctor = { path = "../doze-doctor" }
# doze.hcl: the stack's shape (offline), its diagnostics with their spans, `fmt` (core plan H3, H4).
doze-config = { path = "../doze-config" }
doze-hcl = { path = "../doze-hcl" }
doze-module-proto = { path = "../doze-module-proto" }
# The daemon's control protocol (a client, as the app is) and the words every surface says about it.
doze-control = { path = "../doze-control", features = ["words"] }
doze-display = { path = "../doze-display" }
# Where a stack's state lives (its socket, its journal), and the journal on disk for `why` with the daemon down.
doze-projects = { path = "../doze-projects" }
doze-journal = { path = "../doze-journal" }
doze-logstore = { path = "../doze-logstore" }
# Log lines are stamped with this machine's wall clock, as Go's `time.Local`: the zone from TZ or the system's.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "string"] }
# Completions: the static scripts, and the dynamic engine the shell calls back into (`COMPLETE=<shell> doze`).
clap_complete = { version = "4", features = ["unstable-dynamic"] }
# The registry, module and engine fetch, the cache and doze.lock (core plan F1): `modules`, `init`, `add`, `update`.
doze-fetch = { path = "../doze-fetch" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The registry's signatures (the index, each artifact, the release file): verify only, with the key built in.
ed25519-dalek = { version = "3", default-features = false, features = [] }
tokio = { version = "1.54", features = ["rt", "macros"] }
sha2 = "0.11"
hex = "0.4"
base64ct = { version = "1", features = ["alloc"] }

[dev-dependencies]
ed25519-dalek = { version = "3", default-features = false, features = [] }
# The scripted daemon on a real socket: the commands that talk to doze are tested through the protocol they use.
doze-control = { path = "../doze-control", features = ["words", "test-support"] }
# The writer of meta.yaml, so the module contract is tested through the real round trip.
doze-module-release = { path = "../doze-module-release" }
doze-module-proto = { path = "../doze-module-proto" }
tokio = { version = "1.54", features = ["rt", "macros"] }
