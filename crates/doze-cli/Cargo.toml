[package]
name = "doze-cli"
version = "0.0.0"
description = "The doze command: the terminal's client of doze, as the app is (docs/port/cli/proposal.md)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "doze"
path = "src/main.rs"

[dependencies]
doze-os = { path = "../doze-os" }
doze-names = { path = "../doze-names" }
doze-module-proto = { path = "../doze-module-proto" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = "0.13"
# The registry's signatures (the index, each artifact, the release file): verify only, with the key built in.
ed25519-dalek = { version = "3", default-features = false, features = [] }
sha2 = "0.11"
hex = "0.4"
base64ct = { version = "1", features = ["alloc"] }
# One blocking GET with a deadline: the registry, the release file. No async runtime in the CLI.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

[dev-dependencies]
ed25519-dalek = { version = "3", default-features = false, features = [] }
