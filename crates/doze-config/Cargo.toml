[package]
name = "doze-config"
version = "0.0.0"
description = "doze.hcl: doze's schema over doze-hcl, checked against Go's internal/config"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
doze-hcl = { path = "../doze-hcl" }
# The syntax tree doze-hcl parses into (vendored and pinned: vendor/hcl-edit/PATCHES.md).
hcl-edit = "0.10"
# The project slug and the fingerprints are sha256, as Go's.
sha2 = "0.11"
hex = "0.4"
# The engine's stack, which a loaded config becomes (src/stack.rs).
doze-engine = { path = "../doze-engine" }

[dev-dependencies]
# The oracle for src/psl.rs (tests/psl.rs): a release built from the same list revision.
psl = "=2.1.254"
serde_json = "1"
# The real domain checks, for the oracle's host.
doze-names = { path = "../doze-names" }
# The larder test runs the stack: a module stand-in's plan, and the engine on tokio.
doze-module-proto = { path = "../doze-module-proto" }
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "macros", "time"] }
