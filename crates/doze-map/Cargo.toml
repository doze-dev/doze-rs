[package]
name = "doze-map"
version = "0.0.0"
description = "The desktop app's Map: lays a stack out as cards, calls and captions, from ten instances to thousands"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The R*-tree behind viewport culling and hit tests (see the crate docs for the choice).
rstar = { version = "0.14", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "layout"
harness = false
