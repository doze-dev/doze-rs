[package]
name = "aws-gateway"
version = "0.0.0"
description = "The HTTP front of doze-aws: accepts connections, authenticates, routes to a service, answers"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-schema = { path = "../aws-schema" }
aws-auth = { path = "../aws-auth" }
aws-wire = { path = "../aws-wire" }
doze-runtime = { path = "../doze-runtime" }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
aws-core = { path = "../aws-core" }
aws-model-sqs = { path = "../aws-model-sqs" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
