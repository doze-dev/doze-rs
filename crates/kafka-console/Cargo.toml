[package]
name = "kafka-console"
version = "0.0.0"
description = "The web console: axum, maud components, view-models, traffic recorder"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The "larder" world of the design boards as view-models, and the example that serves it with no broker. The tests
# have it always; a release build does not.
examples = []

[dependencies]
kafka-wire = { path = "../kafka-wire" }
kafka-broker = { path = "../kafka-broker", features = ["inspect"] }
kafka-storage = { path = "../kafka-storage" }
kafka-auth = { path = "../kafka-auth" }
# The Observer trait the recorder implements: the dependency points from the console to the server, never back.
kafka-server = { path = "../kafka-server" }
# The HTTP server and router: no default features (no macros, no json, no tracing, no HTTP/2, no websockets), only
# what the pages need.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
# Compile-time HTML: it expands to string pushes, so it costs no runtime and no dependency of its own at run time.
maud = "0.27"
bytes = "1"
# The embedded text assets are gzip (assets.rs); a client that does not accept gzip is sent them inflated. Already in the tree
# through the broker's gzip record batches: no new package.
flate2 = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
# The connection loop (a header-read timeout and a cap on connections need hyper's own server, which axum::serve does not
# expose). Both are already in the tree through axum; this asks for nothing new from them (the features are axum's).
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "service"] }
# The JSON API of the React console (docs/port/console/react-plan.md): both are already in the default build through
# tracing-subscriber, so they add no package.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
# The embedded bundle is stored gzipped; the rare client that does not accept gzip gets it inflated (flate2 is already in
# the build through kafka-wire).
flate2 = "1"

[dev-dependencies]
# TypeScript types of the JSON API, written by a test into web/src/api/types (a stale file fails the test).
ts-rs = "12"
# The request types a raw test client encodes.
kafka-protocol = { version = "0.18", default-features = false, features = ["client"] }
# Batches to walk in the tests of the record reader.
kafka-wire = { path = "../kafka-wire", features = ["test-support"] }
# The fixtures and the example the integration tests render pages from.
kafka-console = { path = ".", features = ["examples"] }
kafka-storage = { path = "../kafka-storage", features = ["sim"] }
# `oneshot` on a Router, and the bodies of its answers.
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "test-util"] }

[[example]]
name = "boards"
required-features = ["examples"]

[[example]]
name = "produce_bench"
