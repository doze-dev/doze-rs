[package]
name = "kafka-console-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kafka-console = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "origin"
path = "fuzz_targets/origin.rs"
test = false
doc = false

[[bin]]
name = "form"
path = "fuzz_targets/form.rs"
test = false
doc = false
