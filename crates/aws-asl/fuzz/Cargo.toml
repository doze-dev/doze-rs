[package]
name = "aws-asl-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aws-asl = { path = ".." }
serde_json = "1"

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_definition"
path = "fuzz_targets/fuzz_definition.rs"
test = false
doc = false

[[bin]]
name = "fuzz_intrinsic"
path = "fuzz_targets/fuzz_intrinsic.rs"
test = false
doc = false

[[bin]]
name = "fuzz_jsonpath"
path = "fuzz_targets/fuzz_jsonpath.rs"
test = false
doc = false
