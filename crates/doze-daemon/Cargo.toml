[package]
name = "doze-daemon"
version = "0.0.0"
description = "The doze daemon: one stack's engine behind control protocol 2 on a local socket"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
doze-config = { path = "../doze-config" }
doze-control = { path = "../doze-control" }
doze-engine = { path = "../doze-engine" }
# The module catalog: builds found through F1 (a `__fetch` child, doze.lock), run in the module pool.
doze-fetch = { path = "../doze-fetch" }
doze-hcl = { path = "../doze-hcl" }
doze-module-host = { path = "../doze-module-host" }
doze-module-proto = { path = "../doze-module-proto" }
doze-journal = { path = "../doze-journal" }
doze-logstore = { path = "../doze-logstore" }
# The config's domain checks (`__daemon` loads doze.hcl as the CLI does).
doze-names = { path = "../doze-names" }
# Where each instance is reached: its name, its listeners, its routes and its grant (D2).
doze-bind = { path = "../doze-bind" }
doze-os = { path = "../doze-os" }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
tracing = "0.1"

[dev-dependencies]
doze-control = { path = "../doze-control", features = ["test-support"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync", "macros"] }
