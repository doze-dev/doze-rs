[package]
name = "doze-daemon-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
doze-daemon = { path = ".." }
doze-engine = { path = "../../doze-engine" }
doze-os = { path = "../../doze-os" }
tokio = { version = "1.54", features = ["rt-multi-thread"] }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

# The daemon reads doze.hcl through doze-config, which needs the vendored hcl-edit (vendor/hcl-edit/PATCHES.md), as the
# workspace patches it; a fuzz crate is a workspace of its own and must say so too.
[patch.crates-io]
hcl-edit = { path = "../../../vendor/hcl-edit" }

[[bin]]
name = "fuzz_session"
path = "fuzz_targets/fuzz_session.rs"
test = false
doc = false
