[package]
name = "kafka-storage"
version = "0.0.0"
description = "Partition logs on disk: segments, index, recovery, retention, compaction"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kafka-wire = { path = "../kafka-wire" }
doze-fs = { path = "../doze-fs" }
bytes = "1"
thiserror = "2"
arc-swap = "1"
# Only its channels (no runtime): a log announces its end offset and its flushes through them.
tokio = { version = "1", default-features = false, features = ["sync"] }

[features]
# A deterministic in-memory disk with crash points and injected faults, for tests.
sim = ["doze-fs/sim"]

[dev-dependencies]
# The unit tests run on the simulated disk.
doze-fs = { path = "../doze-fs", features = ["sim"] }
# Builds valid batches for the tests.
kafka-wire = { path = "../kafka-wire", features = ["test-support"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
# The simulation suite (tests/simulation) uses the crate with its simulated disk.
kafka-storage = { path = ".", features = ["sim"] }
# Counts allocations, so a test can say that the log never holds its data in memory.
stats_alloc = "0.1"
