[package]
name = "aws-eventbridge-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aws-eventbridge = { path = ".." }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "fuzz_event_pattern"
path = "fuzz_targets/fuzz_event_pattern.rs"
test = false
doc = false
