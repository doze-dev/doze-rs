[package]
name = "aws-eventbridge"
version = "0.0.0"
description = "EventBridge: buses, rules, event patterns, schedules, targets, archives and replay, as a state machine behind a lazy actor per region"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-model-eventbridge = { path = "../aws-model-eventbridge" }
aws-schema = { path = "../aws-schema" }
aws-wire = { path = "../aws-wire" }
aws-core = { path = "../aws-core" }
aws-cron = { path = "../aws-cron" }
aws-webhook = { path = "../aws-webhook" }
tokio-util = { version = "0.7", default-features = false }
aws-peers = { path = "../aws-peers" }
aws-iam-policy = { path = "../aws-iam-policy" }
doze-runtime = { path = "../doze-runtime" }
doze-store = { path = "../doze-store" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros", "net", "io-util"] }

[dev-dependencies]
aws-testkit = { path = "../aws-testkit" }
aws-sqs = { path = "../aws-sqs" }
aws-sns = { path = "../aws-sns" }
aws-kinesis = { path = "../aws-kinesis" }
aws-logs = { path = "../aws-logs" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "test-util", "sync", "net", "io-util"] }
