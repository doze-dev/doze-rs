name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --check
      # The desktop app is left out here: it has its own macOS job (`app`, below).
      - run: cargo clippy --workspace --exclude doze-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude doze-app
      # The TLS feature: its unit tests, the loopback tests and the process test (a C compiler is on both runners).
      - run: cargo test -p kafka-server -p doze-kafka --features tls
      - run: cargo clippy -p kafka-server -p doze-kafka --all-targets --features tls -- -D warnings
      # The storage simulation (random workloads, a disk that fails and loses power at every file operation).
      - run: cargo test -p kafka-storage -p kafka-meta --features kafka-storage/sim --release
        env:
          SIM_SEEDS: "200"
      # The generated aws-model crates are what the models and overlays produce (docs/port/aws/PLAN.md, rule 11).
      - run: cargo xtask codegen --check
      # The desktop app's themes are what the Go app's tokens.css gives (apps/doze-app/themes).
      - run: cargo xtask themes --check
      # No file grows past the hard size limit (docs/port/PLAN.md, quality rule 1).
      - run: cargo xtask lint-size
      # Every parser has a fuzz target (a `// fuzz:parser` marker with no target fails).
      - run: cargo xtask fuzz-check
      # The Phase 8 catalogue: each SEC number defined once, none referenced without a definition, every deviation in the
      # index, every test name it quotes a real `fn` (tools/check-security-catalogue.ts; bun is the only extra tool).
      - uses: oven-sh/setup-bun@v2
      - run: bun tools/check-security-catalogue.ts
      # Public docs build without broken links.
      - run: cargo doc --workspace --exclude doze-app --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # doze-os and the module protocol on all five targets (docs/port/modules/PLAN.md D10): the only platform code and
  # the only `unsafe` in the workspace, and the protocol that runs over it. The Windows runners run elevated, so the postgres test there proves engines start under doze's restricted
  # token (postgres refuses an elevated one: spikes/w0-windows/REPORT.md).
  os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Postgres for the tree test (the Linux images ship one; the Windows x64 image sets PGBIN itself)
        shell: bash
        run: |
          d=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$d" ]; then echo "PGBIN=$d" >> "$GITHUB_ENV"; fi
      - run: cargo clippy -p doze-os -p doze-module-proto -p doze-module -p doze-module-derive -p doze-module-host -p doze-module-test -p doze-module-release -p doze-resp -p doze-module-valkey -p doze-module-kvrocks -p doze-module-temporal -p doze-names -p doze-control -p doze-projects -p doze-journal -p doze-display -p doze-desk --all-targets --features doze-control/test-support -- -D warnings
      - run: cargo test -p doze-os -p doze-module-proto -p doze-module -p doze-module-host -p doze-module-test -p doze-module-release -p doze-resp -p doze-module-valkey -p doze-module-kvrocks -p doze-module-temporal -p doze-names -p doze-control -p doze-projects -p doze-journal -p doze-display -p doze-desk --no-fail-fast -- --nocapture

  # Module acceptance (docs/port/modules/PLAN.md D12): each module boots the engine build doze-binaries publishes, on
  # every target the module declares. DOZE_ACCEPTANCE turns a missing build into a failure, so a skip cannot pass for a
  # pass; a release's `--accepted` may only come from this job.
  modules:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      DOZE_ACCEPTANCE: "1"
      # Every major a module declares is accepted on its newest build: valkey 9 and 8, kvrocks 2.
      VALKEY: "9.1.1"
      VALKEY8: "8.1.9"
      KVROCKS: "2.16.0"
      TEMPORAL: "1.8.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: The engine builds from doze-binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          # <variable>:<engine>:<version> — the variable names where that build's bin/ is.
          for e in "DOZE_VALKEY_BINDIR:valkey:$VALKEY" "VALKEY8_BINDIR:valkey:$VALKEY8" "DOZE_KVROCKS_BINDIR:kvrocks:$KVROCKS" "DOZE_TEMPORAL_BINDIR:temporal:$TEMPORAL"; do
            var=${e%%:*}; rest=${e#*:}; name=${rest%%:*}; v=${rest#*:}
            dir="$RUNNER_TEMP/engines/$name-$v"; art="$name-$v-$TARGET.tar.gz"
            mkdir -p "$dir"
            gh release download "$name" -R doze-dev/doze-binaries -p "$art" -p "$art.sha256" -D "$dir"
            (cd "$dir" && shasum -a 256 -c "$art.sha256")
            tar -xzf "$dir/$art" -C "$dir"
            echo "$var=$dir/$name-$v-$TARGET/bin" >> "$GITHUB_ENV"
          done
      - run: cargo test -p doze-module-valkey -p doze-module-kvrocks -p doze-module-temporal -p doze-names --no-fail-fast -- --nocapture
      - name: valkey's acceptance on its other major (8)
        shell: bash
        run: DOZE_VALKEY_BINDIR="$VALKEY8_BINDIR" cargo test -p doze-module-valkey --test acceptance --no-fail-fast -- --nocapture

  # Windows (docs/port/aws/phase0.md, spike S2): the whole workspace must at least compile there. Tests join as crates are made
  # portable; a red job here is information about what is still Unix-only, not noise.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --exclude doze-app --all-targets

  # The desktop app (apps/doze-app, docs/port/app/PLAN.md step 0.1): GPUI pulls in a few hundred crates and its macOS renderer
  # compiles Metal shaders, so the app is not a default member and has this job of its own. It lints and tests the app (with and
  # without offscreen capture) and doze-os's `ui` feature, holds the app to its own weight line (docs/port/weight.md, "The desktop
  # app"), and renders the screens offscreen through a fixture daemon: the PNGs are this run's artifacts, to look at.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Metal toolchain (Xcode ships it as a separate component)
        run: xcodebuild -downloadComponent MetalToolchain || true
      - run: cargo clippy -p doze-app --all-targets --features capture -- -D warnings
      - run: cargo clippy -p doze-app --all-targets -- -D warnings
      - run: cargo clippy -p doze-os --features ui --all-targets -- -D warnings
      - run: cargo test -p doze-app --features capture
      - name: The app's weight line (binary at most 16 MB, packages at most 560; the release build has no capture)
        run: |
          cargo build --release -p doze-app
          size=$(stat -f %z target/release/doze-app)
          crates=$(cargo tree -p doze-app --prefix none --edges normal --target aarch64-apple-darwin | sort -u | wc -l | tr -d ' ')
          echo "doze-app: $size bytes, $crates packages"
          [ "$size" -le 16000000 ] || { echo "doze-app over 16 MB (PLAN.md §6)"; exit 1; }
          [ "$crates" -le 560 ] || { echo "doze-app over 560 packages (docs/port/weight.md)"; exit 1; }
      - name: Screens, offscreen (fixture daemon → hub → page)
        run: |
          cargo build -p doze-app --features capture
          mkdir -p shots
          app=target/debug/doze-app
          for theme in violet teal; do for mode in dark light; do
            $app shot --fixture larder --screen map --theme $theme --mode $mode --size 1280x800 --out shots/map-larder-$theme-$mode.png
            $app shot --fixture larder --screen palette --theme $theme --mode $mode --size 1280x800 --out shots/palette-$theme-$mode.png
            $app shot --fixture larder --screen help --theme $theme --mode $mode --size 1280x800 --out shots/help-$theme-$mode.png
            for fx in shop crash larder none; do
              $app shot --fixture $fx --screen library --theme $theme --mode $mode --out shots/library-$fx-$theme-$mode.png
            done
            for sc in tiles list grid; do
              $app shot --fixture shop --screen $sc --theme $theme --mode $mode --out shots/$sc-shop-$theme-$mode.png
              $app shot --fixture shop --stack acme --screen $sc --theme $theme --mode $mode --out shots/$sc-stopped-$theme-$mode.png
            done
            $app shot --fixture larder --screen grid --hover orders/catalog --theme $theme --mode $mode --out shots/grid-larder-tip-$theme-$mode.png
          done; done
          $app shot --fixture larder --screen map --select gateway --size 1280x800 --out shots/map-larder-selected.png
          $app shot --fixture larder --screen map --size 900x620 --out shots/map-larder-small.png
          $app shot --synth 2000 --screen map --size 2560x1440 --out shots/map-2k-fit.png
          $app shot --synth 2000 --screen map --size 2560x1440 --zoom 1 --at 3000,3000 --out shots/map-2k-100.png
          $app shot --synth 2000 --screen map --size 2560x1440 --zoom 1 --select data0-session-48 --out shots/map-2k-selected.png
          $app shot --fixture crash --screen list --select api --out shots/list-crash-api.png
          $app shot --fixture shop --screen list --density compact --out shots/list-shop-compact.png
          $app shot --synth 2000 --screen list --out shots/list-2k.png
          ls -la shots
      - name: Screens inside a stack (instance, logs, consoles)
        run: |
          app=target/debug/doze-app
          for theme in violet teal; do for mode in dark light; do
            $app shot --fixture shop --screen instance --select api --theme $theme --mode $mode --out shots/instance-api-$theme-$mode.png
            $app shot --fixture crash --screen instance --select api --theme $theme --mode $mode --out shots/instance-crash-$theme-$mode.png
            $app shot --fixture shop --screen logs --theme $theme --mode $mode --out shots/logs-all-$theme-$mode.png
            $app shot --fixture modules --screen instance --select events --tab console:_ --theme $theme --mode $mode --out shots/console-events-$theme-$mode.png
          done; done
          $app shot --fixture shop --screen instance --select db --out shots/instance-db.png
          $app shot --fixture shop --screen instance --select migrate --out shots/instance-task.png
          $app shot --fixture shop --screen instance --select api --tab logs --filter "/GET|slow/" --out shots/logs-api-pattern.png
          $app shot --fixture shop --screen logs --filter orders --find-mode --out shots/logs-all-find.png
          $app shot --fixture modules --screen instance --select db --tab console:activity --out shots/console-db.png
          $app shot --fixture larder-portclash --screen instance --select gateway --hold 8000 --out shots/instance-portclash.png
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doze-app-shots
          path: shots/

  # Weight is a feature (docs/port/weight.md): numbers may only rise with a written reason, so the limits (xtask/weight-limits.txt) sit a
  # little above the measured values and a change that crosses one has to move the limit and say why.
  # The default build now includes the console (Phase 9, decision D1: the owner chose it). Limits are an ESTIMATE until the
  # first CI run, derived from two measurements that agree (docs/port/weight.md, "Phase 9, slice 9a"): darwin arm64 5,521,456 B
  # times the 1.216 ratio of Phase 7 (4,899,328 on ubuntu x86_64 over 4,029,504 on darwin), and the doze-ubuntu VM
  # (aarch64 Linux, glibc) 5,971,376 B times about 1.12 for x86_64 code: both give about 6.7 MB. The limit is that plus
  # about 5%. The first CI run replaces the estimate with a measurement and the reason is then rewritten.
  # THE OWNER'S CEILING (2026-11-12): "anything less than 10 MB is fine". So the gate is 9 MB, not 7.1: the 2 MB above the
  # estimate is room for the eight slices of pages still to come (Phase 9 b to i), and it is spent only with a reason in weight.md.
  weight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Builds release, measures size, packages and idle memory, and fails over the limits in xtask/weight-limits.txt
      # (the doze-kafka line is the console build; see the comment above).
      - run: cargo xtask weight

  # The broker without the console (`--no-default-features`): one cheap job so that the lean build, the one the Phase 8 limits
  # described, cannot grow unnoticed. Phase 8 closed at 4,301,200 B on darwin and 4,660,632 B in the Linux VM; on ubuntu
  # x86_64 that is about 5.23 MB (the 5.15 MB of the Phase 8 job was already under it by the darwin steps), plus 5% is 5.5 MB.
  weight-lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release -p doze-kafka --no-default-features
      - name: Binary size, crates, idle memory (no console)
        run: |
          size=$(stat -c %s target/release/doze-kafka)
          crates=$(cargo tree -p doze-kafka --no-default-features --prefix none --edges normal | sort -u | wc -l)
          dir=$(mktemp -d)
          target/release/doze-kafka --listen 127.0.0.1:19092 --data-dir "$dir" &
          pid=$!
          sleep 3
          rss=$(awk '/VmRSS/ {print $2}' /proc/$pid/status)
          kill $pid
          echo "binary $size B, $crates packages, idle $rss KB"
          [ "$size" -le 5500000 ] || { echo "lean binary over 5.5 MB"; exit 1; }
          [ "$crates" -le 126 ] || { echo "more than 126 packages in the lean build"; exit 1; }
          [ "$rss" -le 8192 ] || { echo "idle resident memory over 8 MB in the lean build"; exit 1; }
          ! cargo tree -p doze-kafka --no-default-features --prefix none --edges normal | grep -E "^(axum|maud|hyper) " || { echo "the lean build contains the console"; exit 1; }

  # The same measurements for the optional TLS build (docs/port/weight.md, Phase 8 slice 8e). Building it needs a C compiler
  # and an assembler (ring); ubuntu has gcc. The default build above is not affected by the feature and keeps its gates.
  weight-tls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release -p doze-kafka --features tls
      - name: Binary size, crates, idle memory (TLS configured)
        run: |
          size=$(stat -c %s target/release/doze-kafka)
          crates=$(cargo tree -p doze-kafka --features tls --prefix none --edges normal | sort -u | wc -l)
          dir=$(mktemp -d)
          openssl ecparam -name prime256v1 -genkey -noout -out "$dir/key.pem"
          openssl req -x509 -new -sha256 -key "$dir/key.pem" -out "$dir/cert.pem" -days 2 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          target/release/doze-kafka --listen 127.0.0.1:19092 --data-dir "$dir/data" --tls-cert "$dir/cert.pem" --tls-key "$dir/key.pem" &
          pid=$!
          sleep 3
          rss=$(awk '/VmRSS/ {print $2}' /proc/$pid/status)
          kill $pid
          echo "binary $size B, $crates packages, idle $rss KB"
          # The feature adds 838,928 B on macOS arm64; the default build (with the console) is estimated at 6.7 MB on ubuntu x86_64
          # (the job above), ring's x86_64 code being larger the step is taken as 0.9 MB: 6.7 + 0.9 = 7.6 MB, and 5 percent above
          # is 7.98, rounded up to 8,200,000 (an estimate until the first CI run, as above).
          [ "$size" -le 10000000 ] || { echo "tls binary over 10 MB (the owner's ceiling)"; exit 1; }
          # 150 for the default build with the console, plus the 11 lines the feature adds, plus 4.
          [ "$crates" -le 165 ] || { echo "more than 165 packages with tls"; exit 1; }
          [ "$rss" -le 8192 ] || { echo "idle resident memory over 8 MB with tls"; exit 1; }

  # deny.toml sets `all-features = true`, so this checks the `tls` feature's crates (ring, rustls) too.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # A short fuzz run of each parser on nightly; longer runs are for a person at a terminal.
  fuzz:
    runs-on: ubuntu-24.04
    env:
      # rust-toolchain.toml pins stable and would override the nightly action; cargo-fuzz needs nightly.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 30 seconds
        working-directory: crates/kafka-wire/fuzz
        run: |
          for target in fuzz_frame fuzz_request fuzz_batch; do
            mkdir -p "corpus/$target"
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- -max_total_time=30 -max_len=1048576
          done
      - name: Fuzz the module protocol's frame decoder for 30 seconds
        working-directory: crates/doze-module-proto/fuzz
        run: |
          mkdir -p corpus/fuzz_frame
          cargo fuzz run fuzz_frame corpus/fuzz_frame -- -max_total_time=30 -max_len=1048576
      - name: Fuzz the RESP parsers (replies; INFO and MONITOR text) for 30 seconds each
        working-directory: crates/doze-resp/fuzz
        run: |
          mkdir -p corpus/fuzz_reply
          cargo fuzz run fuzz_reply corpus/fuzz_reply -- -max_total_time=30 -max_len=65536
          mkdir -p corpus/fuzz_text
          cargo fuzz run fuzz_text corpus/fuzz_text -- -max_total_time=30 -max_len=65536
      - name: Fuzz the control protocol's NDJSON codec (seeded with a real Go daemon's frames) and its Go duration and time text for 30 seconds each
        working-directory: crates/doze-control/fuzz
        run: |
          mkdir -p corpus/fuzz_codec corpus/fuzz_text
          cargo fuzz run fuzz_codec corpus/fuzz_codec ../testdata/go/live -- -max_total_time=30 -max_len=65536
          cargo fuzz run fuzz_text corpus/fuzz_text -- -max_total_time=30 -max_len=256
      - name: Fuzz temporal's duration parser for 30 seconds
        working-directory: crates/doze-module-temporal/fuzz
        run: |
          mkdir -p corpus/fuzz_duration
          cargo fuzz run fuzz_duration corpus/fuzz_duration -- -max_total_time=30
      - name: Fuzz the .doze resolver's DNS wire and upstream parsers for 30 seconds each
        working-directory: crates/doze-names/fuzz
        run: |
          for t in fuzz_wire fuzz_text; do
            mkdir -p "corpus/$t"
            cargo fuzz run "$t" "corpus/$t" -- -max_total_time=30 -max_len=4096
          done
      - name: Fuzz the journal reader for 30 seconds
        working-directory: crates/doze-journal/fuzz
        run: |
          mkdir -p corpus/fuzz_line
          cargo fuzz run fuzz_line corpus/fuzz_line seeds/fuzz_line -- -max_total_time=30 -max_len=4096
      - name: Fuzz the words' parsers (cleaning, log levels, Go's float grammar) for 30 seconds each
        working-directory: crates/doze-display/fuzz
        run: |
          for t in fuzz_clean fuzz_level fuzz_number; do
            mkdir -p "corpus/$t"
            cargo fuzz run "$t" "corpus/$t" -- -max_total_time=30 -max_len=4096
          done
      - name: Fuzz the PLAIN token for 30 seconds
        working-directory: crates/kafka-auth/fuzz
        run: |
          mkdir -p corpus/plain
          cargo fuzz run plain corpus/plain seeds/plain -- -max_total_time=30 -max_len=524288
      - name: Fuzz the ACL filter and the decision for 30 seconds
        working-directory: crates/kafka-auth/fuzz
        run: |
          mkdir -p corpus/acl_filter
          cargo fuzz run acl_filter corpus/acl_filter seeds/acl_filter -- -max_total_time=30 -max_len=4096
      - name: Fuzz the allowed-hosts guard for 30 seconds
        working-directory: crates/kafka-auth/fuzz
        run: |
          mkdir -p corpus/hostguard
          cargo fuzz run hostguard corpus/hostguard seeds/hostguard -- -max_total_time=30 -max_len=4096
      - name: Fuzz the two SCRAM messages for 30 seconds
        working-directory: crates/kafka-auth/fuzz
        run: |
          for target in scram_first scram_final; do
            mkdir -p "corpus/$target"
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- -max_total_time=30 -max_len=524288
          done
      - name: Fuzz recovery for 30 seconds
        working-directory: crates/kafka-storage/fuzz
        run: |
          mkdir -p corpus/fuzz_recovery
          cargo fuzz run fuzz_recovery corpus/fuzz_recovery seeds/fuzz_recovery -- -max_total_time=30 -max_len=65536
      - name: Fuzz the aws decoders for 30 seconds each
        run: |
          (cd crates/aws-schema/fuzz && mkdir -p corpus/fuzz_json && cargo fuzz run fuzz_json corpus/fuzz_json seeds/fuzz_json -- -max_total_time=30 -max_len=65536)
          cd crates/aws-auth/fuzz
          for target in fuzz_claim fuzz_chunked; do
            mkdir -p "corpus/$target"
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- -max_total_time=30 -max_len=65536
          done
