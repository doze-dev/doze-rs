name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The storage simulation (random workloads, a disk that fails and loses power at every file operation).
      - run: cargo test -p kafka-storage -p kafka-meta --features kafka-storage/sim --release
        env:
          SIM_SEEDS: "200"
      # No file grows past the hard size limit (docs/port/PLAN.md, quality rule 1).
      - run: cargo xtask lint-size
      # Every parser has a fuzz target (a `// fuzz:parser` marker with no target fails).
      - run: cargo xtask fuzz-check
      # Public docs build without broken links.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Windows (docs/port/aws/phase0.md, spike S2): the whole workspace must at least compile there. Tests join as crates are made
  # portable; a red job here is information about what is still Unix-only, not noise.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --all-targets

  # Weight is a feature (docs/port/weight.md): numbers may only rise with a written reason, so the limits below sit a
  # little above the measured values and a change that crosses one has to move the limit and say why.
  weight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release -p doze-kafka
      - name: Binary size, crates, idle memory
        run: |
          size=$(stat -c %s target/release/doze-kafka)
          crates=$(cargo tree -p doze-kafka --prefix none --edges normal | sort -u | wc -l)
          dir=$(mktemp -d)
          target/release/doze-kafka --listen 127.0.0.1:19092 --data-dir "$dir" &
          pid=$!
          sleep 3
          rss=$(awk '/VmRSS/ {print $2}' /proc/$pid/status)
          kill $pid
          echo "binary $size B, $crates packages, idle $rss KB"
          # Measured on ubuntu x86_64: 4,899,328 B (the macOS arm64 build is 3.4 MB); the limit is that plus about 5%.
          [ "$size" -le 5150000 ] || { echo "binary over 5.15 MB"; exit 1; }
          [ "$crates" -le 115 ] || { echo "more than 115 packages"; exit 1; }
          [ "$rss" -le 8192 ] || { echo "idle resident memory over 8 MB"; exit 1; }

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # A short fuzz run of each parser on nightly; longer runs are for a person at a terminal.
  fuzz:
    runs-on: ubuntu-24.04
    env:
      # rust-toolchain.toml pins stable and would override the nightly action; cargo-fuzz needs nightly.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 30 seconds
        working-directory: crates/kafka-wire/fuzz
        run: |
          for target in fuzz_frame fuzz_request fuzz_batch; do
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- -max_total_time=30 -max_len=1048576
          done
      - name: Fuzz recovery for 30 seconds
        working-directory: crates/kafka-storage/fuzz
        run: |
          mkdir -p corpus/fuzz_recovery
          cargo fuzz run fuzz_recovery corpus/fuzz_recovery seeds/fuzz_recovery -- -max_total_time=30 -max_len=65536
