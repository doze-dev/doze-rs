name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --check
      # The desktop app is left out here: it has its own macOS job (`app`, below).
      - run: cargo clippy --workspace --exclude doze-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude doze-app
      # The broker without the console (`--no-default-features`) and the console crate on its own: the two runs above build
      # the default features only. The lean build is the Phase 8 broker with no HTTP in it (docs/port/weight.md, "lean").
      - run: cargo clippy --no-default-features -p doze-kafka -p kafka-console --all-targets -- -D warnings
      - run: cargo test -p kafka-console
      - run: cargo test -p doze-kafka --no-default-features
      # TLS is in the default build (one build since 2026-11-14), so the workspace runs above cover it; kafka-server's own TLS
      # tests need its feature named, as the crate keeps it optional.
      - run: cargo test -p kafka-server --features tls
      - run: cargo clippy -p kafka-server --all-targets --features tls -- -D warnings
      # The storage simulation (random workloads, a disk that fails and loses power at every file operation).
      - run: cargo test -p kafka-storage -p kafka-meta --features kafka-storage/sim --release
        env:
          SIM_SEEDS: "200"
      # The generated aws-model crates are what the models and overlays produce (docs/port/aws/PLAN.md, rule 11).
      - run: cargo xtask codegen --check
      # The desktop app's themes are what the Go app's tokens.css gives (apps/doze-app/themes).
      - run: cargo xtask themes --check
      # No file grows past the hard size limit (docs/port/PLAN.md, quality rule 1).
      - run: cargo xtask lint-size
      # Every parser has a fuzz target (a `// fuzz:parser` marker with no target fails).
      - run: cargo xtask fuzz-check
      # The Phase 8 catalogue: each SEC number defined once, none referenced without a definition, every deviation in the
      # index, every test name it quotes a real `fn` (tools/check-security-catalogue.ts; bun is the only extra tool).
      - uses: oven-sh/setup-bun@v2
      - run: bun tools/check-security-catalogue.ts
      # The same checks of the schema registry's catalogue (docs/port/behaviours/registry.md, REG-n).
      - run: bun tools/check-registry-catalogue.ts
      # The Phase 9 catalogue (docs/port/behaviours/console.md): each CON number defined once, none referenced without a
      # definition, every test name it quotes a real `fn`; the lean tree has no HTTP and the default tree has the console
      # (decision D1: `default = []` would take the console out and the size limits, being upper bounds, would not notice).
      - run: bun tools/check-console-catalogue.ts --lean-tree --default-tree
      # Public docs build without broken links.
      - run: cargo doc --workspace --exclude doze-app --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # doze-os and the module protocol on all five targets (docs/port/modules/PLAN.md D10): the only platform code and
  # the only `unsafe` in the workspace, and the protocol that runs over it. The Windows runners run elevated, so the postgres test there proves engines start under doze's restricted
  # token (postgres refuses an elevated one: spikes/w0-windows/REPORT.md).
  os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Postgres for the tree test (the Linux images ship one; the Windows x64 image sets PGBIN itself)
        shell: bash
        run: |
          d=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$d" ]; then echo "PGBIN=$d" >> "$GITHUB_ENV"; fi
      - run: cargo clippy -p doze-os -p doze-module-proto -p doze-module -p doze-module-derive -p doze-module-host -p doze-module-test -p doze-module-release -p doze-resp -p doze-module-valkey -p doze-module-kvrocks -p doze-module-temporal -p doze-names -p doze-fetch -p doze-control -p doze-projects -p doze-journal -p doze-display -p doze-desk -p doze-cli -p doze-doctor -p doze-logstore -p doze-hcl -p doze-config --all-targets --features doze-control/test-support -- -D warnings
      # doze-fetch's live test checks every module the real registry publishes (signed index, signed archive, unpacked)
      # for this runner's platform (modules ship for macOS and Linux; on Windows the indexes are checked).
      - run: cargo test -p doze-os -p doze-module-proto -p doze-module -p doze-module-host -p doze-module-test -p doze-module-release -p doze-resp -p doze-module-valkey -p doze-module-kvrocks -p doze-module-temporal -p doze-names -p doze-fetch -p doze-control -p doze-projects -p doze-journal -p doze-display -p doze-desk -p doze-cli -p doze-doctor -p doze-logstore -p doze-hcl -p doze-config --no-fail-fast -- --nocapture
        env:
          DOZE_LIVE_REGISTRY: "1"
      - name: doze-names with the network daemon (tun-rs; the root end-to-end test skips itself here)
        run: cargo clippy -p doze-names --features netd --all-targets -- -D warnings && cargo test -p doze-names --features netd --no-fail-fast
      - name: doze-names with machine setup and trust (every system's scripts are tested on every system)
        run: cargo clippy -p doze-names --features setup --all-targets -- -D warnings && cargo test -p doze-names --features setup --no-fail-fast
      # The runner is elevated, so this is setup for real: the NRPT rule for .doze to the resolver on 127.0.0.53:53, a
      # name answered through the system resolver (getaddrinfo, the DNS client, the rule), a declared domain routed and a
      # throwaway doze CA trusted in the machine's Root store and removed, then uninstall (crates/doze-names/tests/setup_root.rs).
      - name: doze-names setup and trust for real (Windows, elevated)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: DOZE_NAMES_ROOT_E2E=1 DOZE_HOME="$RUNNER_TEMP/doze-names-e2e" cargo test -p doze-names --features setup --test setup_root -- --nocapture

  # Module acceptance (docs/port/modules/PLAN.md D12): each module boots the engine build doze-binaries publishes, on
  # every target the module declares. DOZE_ACCEPTANCE turns a missing build into a failure, so a skip cannot pass for a
  # pass; a release's `--accepted` may only come from this job.
  modules:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      DOZE_ACCEPTANCE: "1"
      # Every major a module declares is accepted on its newest build: valkey 9 and 8, kvrocks 2.
      VALKEY: "9.1.1"
      VALKEY8: "8.1.9"
      KVROCKS: "2.16.0"
      TEMPORAL: "1.8.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: The engine builds from doze-binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          # <variable>:<engine>:<version> — the variable names where that build's bin/ is.
          for e in "DOZE_VALKEY_BINDIR:valkey:$VALKEY" "VALKEY8_BINDIR:valkey:$VALKEY8" "DOZE_KVROCKS_BINDIR:kvrocks:$KVROCKS" "DOZE_TEMPORAL_BINDIR:temporal:$TEMPORAL"; do
            var=${e%%:*}; rest=${e#*:}; name=${rest%%:*}; v=${rest#*:}
            dir="$RUNNER_TEMP/engines/$name-$v"; art="$name-$v-$TARGET.tar.gz"
            mkdir -p "$dir"
            gh release download "$name" -R doze-dev/doze-binaries -p "$art" -p "$art.sha256" -D "$dir"
            (cd "$dir" && shasum -a 256 -c "$art.sha256")
            tar -xzf "$dir/$art" -C "$dir"
            echo "$var=$dir/$name-$v-$TARGET/bin" >> "$GITHUB_ENV"
          done
      - run: cargo test -p doze-module-valkey -p doze-module-kvrocks -p doze-module-temporal -p doze-names -p doze-hcl --no-fail-fast -- --nocapture
      - name: valkey's acceptance on its other major (8)
        shell: bash
        run: DOZE_VALKEY_BINDIR="$VALKEY8_BINDIR" cargo test -p doze-module-valkey --test acceptance --no-fail-fast -- --nocapture

  # Windows (docs/port/aws/phase0.md, spike S2): the whole workspace must at least compile there. Tests join as crates are made
  # portable; a red job here is information about what is still Unix-only, not noise.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --exclude doze-app --all-targets

  # The desktop app (apps/doze-app, docs/port/app/PLAN.md step 0.1): GPUI pulls in a few hundred crates and its macOS renderer
  # compiles Metal shaders, so the app is not a default member and has this job of its own. It lints and tests the app (with and
  # without offscreen capture) and doze-os's `ui` feature, holds the app to its own weight line (docs/port/weight.md, "The desktop
  # app"), and renders the screens offscreen through a fixture daemon: the PNGs are this run's artifacts, to look at.
  app:
    runs-on: macos-latest
    env:
      # Whether the signing secrets exist (a step cannot test a secret directly).
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Metal toolchain (Xcode ships it as a separate component)
        run: xcodebuild -downloadComponent MetalToolchain || true
      - run: cargo clippy -p doze-app --all-targets --features capture -- -D warnings
      - run: cargo clippy -p doze-app --all-targets -- -D warnings
      - run: cargo clippy -p doze-os --features ui --all-targets -- -D warnings
      - run: cargo test -p doze-app --features capture
      - name: The app's weight line (binary at most 16 MB, packages at most 650 with the CLI and its machine setup inside, weight.md; the release-app build has no capture)
        run: |
          cargo build --profile release-app -p doze-app
          size=$(stat -f %z target/release-app/doze-app)
          crates=$(cargo tree -p doze-app --prefix none --edges normal --target aarch64-apple-darwin | sort -u | wc -l | tr -d ' ')
          echo "doze-app: $size bytes, $crates packages"
          [ "$size" -le 16000000 ] || { echo "doze-app over 16 MB (PLAN.md §6)"; exit 1; }
          [ "$crates" -le 650 ] || { echo "doze-app over 650 packages (docs/port/weight.md)"; exit 1; }
      # Doze.app (PLAN.md step 3.5): signed ad hoc, or with a Developer ID and notarised when the secrets exist. With no
      # secrets (forks, and until the owner adds them) the import is skipped and the bundle is signed ad hoc.
      - name: Signing identity (only when the secrets exist)
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          kc="$RUNNER_TEMP/doze.keychain-db"; pw=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          # codesign runs without a prompt only once the key's partition list allows it.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc"
          if [ -n "$NOTARY_KEY_P8" ]; then echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"; fi
      - name: Doze.app
        env:
          DOZE_SIGN_ID: ${{ secrets.DOZE_SIGN_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
        run: |
          # One condition for both steps: a Developer ID only with the identity imported above, else ad hoc.
          if [ "$HAS_CERT" != "true" ]; then unset DOZE_SIGN_ID NOTARY_KEY_ID NOTARY_ISSUER_ID; HAS_NOTARY=false; fi
          if [ "$HAS_CERT" = "true" ] && [ -z "$DOZE_SIGN_ID" ]; then echo "::warning::MACOS_CERT_P12 is set but DOZE_SIGN_ID is not: signing ad hoc"; fi
          if [ "$HAS_NOTARY" = "true" ]; then export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"; fi
          cargo xtask app-bundle --no-build --id dev.doze.app --version "0.0.${GITHUB_RUN_NUMBER}" --out bundle
          plutil -p bundle/Doze.app/Contents/Info.plist
          codesign -dv bundle/Doze.app
          ditto -c -k --keepParent bundle/Doze.app bundle/Doze.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Doze.app
          path: bundle/Doze.app.zip
      - name: Screens, offscreen (fixture daemon → hub → page)
        run: |
          cargo build -p doze-app --features capture
          mkdir -p shots
          app=target/debug/doze-app
          for theme in violet teal; do for mode in dark light; do
            $app shot --fixture larder --screen map --theme $theme --mode $mode --size 1280x800 --out shots/map-larder-$theme-$mode.png
            $app shot --fixture larder --screen palette --theme $theme --mode $mode --size 1280x800 --out shots/palette-$theme-$mode.png
            $app shot --fixture larder --screen help --theme $theme --mode $mode --size 1280x800 --out shots/help-$theme-$mode.png
            for fx in shop crash larder none; do
              $app shot --fixture $fx --screen library --theme $theme --mode $mode --out shots/library-$fx-$theme-$mode.png
            done
            for sc in tiles list grid; do
              $app shot --fixture shop --screen $sc --theme $theme --mode $mode --out shots/$sc-shop-$theme-$mode.png
              $app shot --fixture shop --stack acme --screen $sc --theme $theme --mode $mode --out shots/$sc-stopped-$theme-$mode.png
            done
            $app shot --fixture larder --screen grid --hover orders/catalog --theme $theme --mode $mode --out shots/grid-larder-tip-$theme-$mode.png
          done; done
          $app shot --fixture larder --screen map --select gateway --size 1280x800 --out shots/map-larder-selected.png
          $app shot --fixture larder --screen map --size 900x620 --out shots/map-larder-small.png
          $app shot --synth 2000 --screen map --size 2560x1440 --out shots/map-2k-fit.png
          $app shot --synth 2000 --screen map --size 2560x1440 --zoom 1 --at 3000,3000 --out shots/map-2k-100.png
          $app shot --synth 2000 --screen map --size 2560x1440 --zoom 1 --select data0-session-48 --out shots/map-2k-selected.png
          $app shot --fixture crash --screen list --select api --out shots/list-crash-api.png
          $app shot --fixture shop --screen list --density compact --out shots/list-shop-compact.png
          $app shot --synth 2000 --screen list --out shots/list-2k.png
          $app shot --synth 2000 --screen grid --out shots/grid-2k.png
          # M2: the dialogs, the sheets, a failed start, the empty folder (each done through the same calls a key makes)
          for act in sleep restart reset-typed; do $app shot --fixture shop --screen list --select db --act $act --out shots/act-$act.png; done
          for act in start preflight failed recent; do $app shot --fixture shop --stack acme --screen tiles --act $act --out shots/act-$act.png; done
          for act in remove empty-found add; do $app shot --fixture shop --screen library --act $act --out shots/act-$act.png; done
          $app shot --fixture modules --screen instance --select events --tab console:_ --act action-typed --out shots/act-action.png
          # M2: ⌘K and Needs you (the bell, the alerts, the away strip), and a failed start in Needs you
          $app shot --fixture shop --screen palette --query "sleep ca" --out shots/palette-sleep-ca.png
          $app shot --fixture shop --screen palette --scope shop/db --out shots/palette-scope.png
          $app shot --fixture crash --screen palette --query api --out shots/palette-crash-api.png
          for over in bell alerts away; do $app shot --fixture crash --screen tiles --over $over --out shots/attn-$over.png; done
          $app shot --fixture shop --stack acme --screen tiles --act failed --over bell --out shots/attn-failed.png
          # M3: a notification said in the app (no bundle)
          $app shot --fixture crash --screen library --over note --out shots/notify-in-app.png
          $app shot --synth 2000 --screen grid --at 3000,20000 --out shots/grid-2k-scrolled.png
          ls -la shots
      - name: Screens inside a stack (instance, logs, consoles)
        run: |
          app=target/debug/doze-app
          for theme in violet teal; do for mode in dark light; do
            $app shot --fixture shop --screen instance --select api --theme $theme --mode $mode --out shots/instance-api-$theme-$mode.png
            $app shot --fixture crash --screen instance --select api --theme $theme --mode $mode --out shots/instance-crash-$theme-$mode.png
            $app shot --fixture shop --screen logs --theme $theme --mode $mode --out shots/logs-all-$theme-$mode.png
            $app shot --fixture modules --screen instance --select events --tab console:_ --theme $theme --mode $mode --out shots/console-events-$theme-$mode.png
          done; done
          $app shot --fixture shop --screen instance --select db --out shots/instance-db.png
          $app shot --fixture shop --screen instance --select migrate --out shots/instance-task.png
          $app shot --fixture shop --screen instance --select api --tab logs --filter "/GET|slow/" --out shots/logs-api-pattern.png
          $app shot --fixture shop --screen logs --filter orders --find-mode --out shots/logs-all-find.png
          $app shot --fixture modules --screen instance --select db --tab console:activity --out shots/console-db.png
          $app shot --fixture larder-portclash --screen instance --select gateway --hold 8000 --out shots/instance-portclash.png
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doze-app-shots
          path: shots/

  # Weight is a feature (docs/port/weight.md): numbers may only rise with a written reason, so the limits (xtask/weight-limits.txt) sit a
  # little above the measured values and a change that crosses one has to move the limit and say why.
  # The default build includes the console (Phase 9, decision D1: the owner chose it). The size limit is 7.8 MB, re-based by the
  # weight pass of 2026-11-13 (weight.md, "Phase 9, weight pass"): fat LTO, the console and its HTTP stack at opt-level z, and the
  # text assets embedded as gzip took the default build from 8,055,312 B to 5,797,328 B on darwin (6,626,840 B in the doze-ubuntu
  # VM, aarch64 Linux). The ubuntu x86_64 estimate, from two measurements that agree to 5% (darwin times the 1.216 ratio of
  # Phase 7: 7.05 MB; the VM times about 1.12: 7.42 MB), is 7.4 MB at most, and the limit is that plus about 5%. The owner's ceiling
  # (2026-11-12, "anything less than 10 MB is fine") is 10 MB: the 2.2 MB between this limit and it is not spent. A rise needs a
  # reason written in weight.md. The first CI run replaces the estimate with a measurement; the limit stays until a person lowers it.
  weight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Builds release, measures size, packages and idle memory, and fails over the limits in xtask/weight-limits.txt
      # (the doze-kafka line is the console build; see the comment above).
      - run: cargo xtask weight
      # D1: the console is in the default build. `default = []` would drop it, and every limit is only an upper bound.
      - name: The default build contains the console
        run: |
          tree=$(cargo tree -p doze-kafka --prefix none --edges normal)
          for name in axum hyper kafka-console; do
            echo "$tree" | grep -q "^$name " || { echo "the default build lacks $name: the console is not in it"; exit 1; }
          done

  # The CLI-only doze, in a job of its own so its line is judged whatever the other binaries do.
  weight-doze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The CLI-only doze (core plan §6.3: a 9 MB line under the 10 MB ceiling). P1 measured 4,986,168 B and 185 packages
      # on Linux aarch64 (the Lima VM); the package line leaves room for the core's crates as they land (weight.md).
      # C2a adds doze.hcl (doze-config, doze-hcl, hcl-edit and winnow) and the completion engine: 210 packages on darwin,
      # 6,207,024 B; the line moves to 230 (docs/port/core/weight.md, C2a).
      - name: doze (the CLI) under 9 MB
        run: |
          cargo build --release -p doze-cli
          size=$(stat -c %s target/release/doze)
          crates=$(cargo tree -p doze-cli --prefix none --edges normal | sort -u | wc -l)
          echo "doze: $size bytes, $crates packages"
          [ "$size" -le 9000000 ] || { echo "doze over 9 MB (core plan §6.3)"; exit 1; }
          [ "$crates" -le 230 ] || { echo "doze over 230 packages (docs/port/weight.md)"; exit 1; }

  # The broker without the console (`--no-default-features`): one cheap job so that the lean build, the one the Phase 8 limits
  # described, cannot grow unnoticed. Re-based by the weight pass of 2026-11-13: 3,917,008 B on darwin and 4,398,512 B in the Linux
  # VM (4,726,200 B there before the pass; the profile change reaches the lean build too); on ubuntu x86_64 that is 4.76 MB (darwin
  # times 1.216) to 4.93 MB (the VM times 1.12), plus 5% is 5.2 MB. 127 packages in the VM (the 126 of this job was already one under).
  # 2026-11-14 (owner decision): the size limit is CI's measurement on main that day, 5,263,296 B, exact; idle is the median of three
  # starts (6,884 KB) plus 5%, 7,229 KB (weight.md).
  weight-lean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release -p doze-kafka --no-default-features
      - name: Binary size, crates, idle memory (no console)
        run: |
          size=$(stat -c %s target/release/doze-kafka)
          crates=$(cargo tree -p doze-kafka --no-default-features --prefix none --edges normal | sort -u | wc -l)
          dir=$(mktemp -d)
          # Idle memory is the median of three fresh starts: one sample moved by hundreds of KB between runs (weight.md, 2026-11-14).
          samples=""
          for i in 1 2 3; do
            target/release/doze-kafka --listen 127.0.0.1:19092 --data-dir "$dir/$i" &
            pid=$!
            sleep 3
            samples="$samples $(awk '/VmRSS/ {print $2}' /proc/$pid/status)"
            kill $pid; wait $pid || true
          done
          echo "idle samples:$samples KB"
          rss=$(echo $samples | tr ' ' '\n' | sort -n | sed -n 2p)
          echo "binary $size B, $crates packages, idle $rss KB"
          [ "$size" -le 5263296 ] || { echo "lean binary over 5,263,296 B"; exit 1; }
          [ "$crates" -le 130 ] || { echo "more than 130 packages in the lean build"; exit 1; }
          [ "$rss" -le 7229 ] || { echo "idle resident memory over 7,229 KB in the lean build"; exit 1; }
          ! cargo tree -p doze-kafka --no-default-features --prefix none --edges normal | grep -E "^(axum|hyper|tower|kafka-console) " || { echo "the lean build contains the console"; exit 1; }

  # TLS is in the default build since 2026-11-14 (the owner: one build), so its size and packages are the `weight` job's (xtask/weight-limits.txt).
  # This job keeps one thing the default job does not: idle memory with TLS configured (a certificate loaded), from the same default binary.
  weight-tls-idle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release -p doze-kafka
      - name: Idle memory with TLS configured
        run: |
          dir=$(mktemp -d)
          openssl ecparam -name prime256v1 -genkey -noout -out "$dir/key.pem"
          openssl req -x509 -new -sha256 -key "$dir/key.pem" -out "$dir/cert.pem" -days 2 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          # Idle memory is the median of three fresh starts (weight.md, 2026-11-14).
          samples=""
          for i in 1 2 3; do
            target/release/doze-kafka --listen 127.0.0.1:19092 --data-dir "$dir/data$i" --tls-cert "$dir/cert.pem" --tls-key "$dir/key.pem" &
            pid=$!
            sleep 3
            samples="$samples $(awk '/VmRSS/ {print $2}' /proc/$pid/status)"
            kill $pid; wait $pid || true
          done
          echo "idle samples:$samples KB"
          rss=$(echo $samples | tr ' ' '\n' | sort -n | sed -n 2p)
          echo "idle $rss KB with TLS configured"
          # CI's measurement with TLS configured on 2026-11-14 (median 10,104 KB) plus 5% (weight.md, "Limits raised to the measured values").
          [ "$rss" -le 10610 ] || { echo "idle resident memory over 10,610 KB with TLS configured"; exit 1; }

  # The React console (web/, docs/port/console/react-plan.md): its built bundle is committed in crates/kafka-console/web-dist
  # so that `cargo build` needs no bun. This rebuilds it from the locked dependencies and fails if the result differs from what
  # is committed, then runs the type check, the lint and the unit tests. The Playwright gate (web/e2e) is a local gate: it needs
  # three browsers and the release binary (web/README.md).
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - name: The committed bundle is the one the sources build
        run: git diff --exit-code --stat -- crates/kafka-console/web-dist web/src/api/types
      - run: bun run typecheck && bun run lint && bun test
        working-directory: web

  # deny.toml sets `all-features = true`, so this checks the `tls` feature's crates (ring, rustls) too.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # A short fuzz run of each parser on nightly; longer runs are for a person at a terminal.
  fuzz:
    runs-on: ubuntu-24.04
    env:
      # rust-toolchain.toml pins stable and would override the nightly action; cargo-fuzz needs nightly.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 30 seconds
        working-directory: crates/kafka-wire/fuzz
        run: |
          for target in fuzz_frame fuzz_request fuzz_batch; do
            mkdir -p "corpus/$target"
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- -max_total_time=30 -max_len=1048576
          done
      - name: Fuzz the module protocol's frame decoder for 30 seconds
        working-directory: crates/doze-module-proto/fuzz
        run: |
          mkdir -p corpus/fuzz_frame
          cargo fuzz run fuzz_frame corpus/fuzz_frame -- -max_total_time=30 -max_len=1048576
      - name: Fuzz the RESP parsers (replies; INFO and MONITOR text) for 30 seconds each
        working-directory: crates/doze-resp/fuzz
        run: |
          mkdir -p corpus/fuzz_reply
          cargo fuzz run fuzz_reply corpus/fuzz_reply -- -max_total_time=30 -max_len=65536
          mkdir -p corpus/fuzz_text
          cargo fuzz run fuzz_text corpus/fuzz_text -- -max_total_time=30 -max_len=65536
      - name: Fuzz the control protocol's NDJSON codec (seeded with a real Go daemon's frames) and its Go duration and time text for 30 seconds each
        working-directory: crates/doze-control/fuzz
        run: |
          mkdir -p corpus/fuzz_codec corpus/fuzz_text
          cargo fuzz run fuzz_codec corpus/fuzz_codec ../testdata/go/live -- -max_total_time=30 -max_len=65536
          cargo fuzz run fuzz_text corpus/fuzz_text -- -max_total_time=30 -max_len=256
      - name: Fuzz temporal's duration parser for 30 seconds
        working-directory: crates/doze-module-temporal/fuzz
        run: |
          mkdir -p corpus/fuzz_duration
          cargo fuzz run fuzz_duration corpus/fuzz_duration -- -max_total_time=30
      # The seeds include an alias bomb and deep nesting (F1 audit, blocker 1): both must be refused quickly, not grown.
      - name: Fuzz doze-fetch's parsers (doze.lock, the registry's files, the mirror manifest) for 30 seconds each
        working-directory: crates/doze-fetch/fuzz
        run: |
          for t in fuzz_lock fuzz_index fuzz_manifest fuzz_meta fuzz_latest; do
            mkdir -p "corpus/$t"
            cargo fuzz run "$t" "corpus/$t" "seeds/$t" -- -max_total_time=30 -max_len=65536 -rss_limit_mb=512
          done
      - name: Fuzz the .doze resolver's DNS wire, upstream and setup parsers for 30 seconds each
        working-directory: crates/doze-names/fuzz
        run: |
          for t in fuzz_wire fuzz_text fuzz_setup; do
            mkdir -p "corpus/$t"
            cargo fuzz run "$t" "corpus/$t" -- -max_total_time=30 -max_len=4096
          done
      - name: Fuzz the journal reader for 30 seconds
        working-directory: crates/doze-journal/fuzz
        run: |
          mkdir -p corpus/fuzz_line
          cargo fuzz run fuzz_line corpus/fuzz_line seeds/fuzz_line -- -max_total_time=30 -max_len=4096
      - name: Fuzz the log store's line reader for 30 seconds
        working-directory: crates/doze-logstore/fuzz
        run: |
          mkdir -p corpus/fuzz_logline
          cargo fuzz run fuzz_logline corpus/fuzz_logline -- -max_total_time=30 -max_len=4096
      - name: Fuzz the CLI's command line and TZ for 30 seconds each
        working-directory: crates/doze-cli/fuzz
        run: |
          for t in fuzz_argv fuzz_env; do
            mkdir -p "corpus/$t"
            cargo fuzz run "$t" "corpus/$t" -- -max_total_time=30 -max_len=4096
          done
      - name: Fuzz the words' parsers (cleaning, log levels, Go's float grammar) for 30 seconds each
        working-directory: crates/doze-display/fuzz
        run: |
          for t in fuzz_clean fuzz_level fuzz_number; do
            mkdir -p "corpus/$t"
            cargo fuzz run "$t" "corpus/$t" -- -max_total_time=30 -max_len=4096
          done
      - name: Fuzz doze-hcl (tokens and syntax check, parse, evaluate, numbers) for 30 seconds each
        working-directory: crates/doze-hcl/fuzz
        run: |
          for t in fuzz_check fuzz_parse fuzz_eval fuzz_number fuzz_funcs fuzz_fmt; do
            mkdir -p "corpus/$t"
            cargo fuzz run "$t" "corpus/$t" -- -max_total_time=30 -max_len=4096
          done
      - name: Fuzz the doze.hcl loader (both passes, seeded with the oracle corpus) and the public suffix lookup for 30 seconds each
        working-directory: crates/doze-config/fuzz
        run: |
          mkdir -p corpus/fuzz_load
          cargo fuzz run fuzz_load corpus/fuzz_load ../testdata/oracle/files -- -max_total_time=30 -max_len=4096
          mkdir -p corpus/fuzz_psl
          cargo fuzz run fuzz_psl corpus/fuzz_psl -- -max_total_time=30 -max_len=512
      - name: Fuzz the PLAIN token for 30 seconds
        working-directory: crates/kafka-auth/fuzz
        run: |
          mkdir -p corpus/plain
          cargo fuzz run plain corpus/plain seeds/plain -- -max_total_time=30 -max_len=524288
      - name: Fuzz the ACL filter and the decision for 30 seconds
        working-directory: crates/kafka-auth/fuzz
        run: |
          mkdir -p corpus/acl_filter
          cargo fuzz run acl_filter corpus/acl_filter seeds/acl_filter -- -max_total_time=30 -max_len=4096
      - name: Fuzz the schema registry (ordered JSON, Avro, Protobuf and JSON Schema schemas, the REST API, the wire header) for 30 seconds each
        working-directory: crates/kafka-registry/fuzz
        run: |
          for t in json_node avro_schema protobuf_schema json_schema registry_api wire; do
            mkdir -p "corpus/$t"
            cargo fuzz run "$t" "corpus/$t" -- -max_total_time=30 -max_len=65536
          done
      - name: Fuzz the allowed-hosts guard for 30 seconds
        working-directory: crates/kafka-auth/fuzz
        run: |
          mkdir -p corpus/hostguard
          cargo fuzz run hostguard corpus/hostguard seeds/hostguard -- -max_total_time=30 -max_len=4096
      - name: Fuzz the two SCRAM messages for 30 seconds
        working-directory: crates/kafka-auth/fuzz
        run: |
          for target in scram_first scram_final; do
            mkdir -p "corpus/$target"
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- -max_total_time=30 -max_len=524288
          done
      - name: Fuzz the console's same-origin rule and form decoder for 30 seconds
        working-directory: crates/kafka-console/fuzz
        run: |
          for target in origin form; do
            mkdir -p "corpus/$target"
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- -max_total_time=30 -max_len=4096
          done
      - name: Fuzz recovery for 30 seconds
        working-directory: crates/kafka-storage/fuzz
        run: |
          mkdir -p corpus/fuzz_recovery
          cargo fuzz run fuzz_recovery corpus/fuzz_recovery seeds/fuzz_recovery -- -max_total_time=30 -max_len=65536
      - name: Fuzz the aws decoders for 30 seconds each
        run: |
          (cd crates/aws-schema/fuzz && mkdir -p corpus/fuzz_json && cargo fuzz run fuzz_json corpus/fuzz_json seeds/fuzz_json -- -max_total_time=30 -max_len=65536)
          cd crates/aws-auth/fuzz
          for target in fuzz_claim fuzz_chunked; do
            mkdir -p "corpus/$target"
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- -max_total_time=30 -max_len=65536
          done
